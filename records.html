<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="style.css">
  <title>ดูข้อมูล | SHE Portal</title>
  <style>
    /* ส่วนจัดการรายงาน (ขอแก้ไข / แก้ไขพร้อมเหตุผล / ประวัติ) */
    #detail{border:1px solid var(--line);border-radius:8px;padding:1rem;margin:0 0 1.5rem;background:#fff}
    #detail h4{margin:1.2rem 0 .4rem}
    #detail dl{display:grid;grid-template-columns:minmax(9rem,14rem) 1fr;gap:.25rem .8rem;margin:0}
    #detail dt{font-weight:600}
    #detail dd{margin:0;overflow-wrap:anywhere}
    .editgrid label{display:block;margin:.6rem 0 .15rem;font-weight:600}
    .editgrid input[type=text],.editgrid input[type=date],.editgrid input[type=time],.editgrid select,.editgrid textarea{width:100%}
    .editgrid input[type=time]{padding:.6rem .75rem;margin-top:.3rem;border:1px solid #9aa6bb;border-radius:8px;font:inherit;background:#fff;color:inherit}
    .editgrid textarea{min-height:4.5rem}
    .changed{outline:2px solid var(--brand);outline-offset:1px}
    .editgrid label.chk{display:inline-flex;align-items:center;gap:.3rem;margin:.2rem .8rem .2rem 0;font-weight:400}
    .personedit{border:1px dashed var(--line);border-radius:8px;padding:.6rem .8rem;margin:.6rem 0}
    .reqbox,.logbox{border-left:4px solid var(--line);padding:.4rem .8rem;margin:.5rem 0}
    /* สีตามสถานะคำขอ: เหลือง=รอ, เขียว=อนุมัติ, แดง=ไม่อนุมัติ, เทา=ยกเลิก */
    .reqbox{border-radius:0 8px 8px 0;border-left-width:6px}
    .reqbox.pending{border-left-color:#e0a100;background:#fff8e1}
    .reqbox.approved{border-left-color:#1b7a3d;background:#eaf6ee}
    .reqbox.rejected{border-left-color:#c62828;background:#fdecec}
    .reqbox.cancelled{border-left-color:#8a94a6;background:#f3f4f6}
    .stchip{display:inline-block;padding:.1rem .7rem;border-radius:999px;font-weight:700;font-size:.9rem;color:#fff;margin-right:.4rem}
    .stchip.pending{background:#b57a00}.stchip.approved{background:#1b7a3d}.stchip.rejected{background:#c62828}.stchip.cancelled{background:#6b7385}
    .notebox{margin-top:.3rem;padding:.35rem .6rem;border-radius:6px;background:#fff;border:1px solid #f0b4b4;font-weight:600}
    .reqbox.approved .notebox{border-color:#a9d7b8}
    .resultbox{border-left:6px solid;border-radius:0 8px 8px 0;padding:.6rem .9rem;margin:.6rem 0;font-weight:600}
    .resultbox.rejected{background:#fdecec;border-color:#c62828;color:#8e1b1b}
    .resultbox.approved{background:#eaf6ee;border-color:#1b7a3d;color:#14532d}
    .resultbox small{display:block;font-weight:400;color:#333;margin-top:.15rem}
    .badge.rejected{background:#fdecec;border-color:#e08a8a;color:#8e1b1b}
    .badge.approved{background:#eaf6ee;border-color:#8cc5a0;color:#14532d}
    .badge.cancelled{background:#f3f4f6;color:#555}
    #t-incident tr.needs-action td{background:#fff8e1}
    #t-incident tr.needs-action td:first-child{box-shadow:inset 5px 0 0 #e0a100}
    .nextbox{border-left-width:6px}
    .nextbox .now{font-size:1.1rem}
    .logbox small,.reqbox small{color:#555}
    dialog#reqdlg{width:min(720px,94vw);max-height:88vh;overflow:auto;border:1px solid var(--line);border-radius:12px;padding:1rem 1.2rem}
    dialog#reqdlg::backdrop{background:rgba(0,0,0,.45)}
    button.badge.pend{cursor:pointer;font-family:inherit}
    .pendsum{display:block;font-size:.8rem;color:#555;margin-top:.25rem;max-width:16rem}
    .rowbtns{display:flex;flex-wrap:wrap;gap:.5rem;margin-top:.6rem;align-items:center}
    .badge{display:inline-block;padding:.12rem .65rem;border-radius:999px;border:1px solid var(--line);font-size:.85rem;font-weight:600}
    .badge.closed{background:#eee}.badge.pend{background:#fff4d6;border-color:#e0b43a;color:#6b4200}
    .badge.review{background:#e8f1fc;border-color:#8fb8e8;color:#004c99}.badge.invest{background:#fff4d6;border-color:#e0b43a;color:#6b4200}
    .badge.done{background:#e6f4ea;border-color:#8cc5a0;color:#14532d}
    /* แถบค้นหา/กรอง: ช่องค้นหาใหญ่ + ปุ่มเลือกขั้นตอน (กดแล้วกรองทันที) + ตัวกรองละเอียดจัดเป็นตาราง */
    .filterbar{display:grid;gap:.85rem;padding:1rem 1.1rem;margin:0 0 1rem;border:1px solid var(--line);border-radius:14px;background:linear-gradient(180deg,#f8faff,#f1f5fc);max-width:none!important}
    .fb-search{display:flex;gap:.6rem;align-items:stretch}
    .fb-search .sbox{position:relative;flex:1}
    .fb-search .sbox svg{position:absolute;left:.85rem;top:50%;transform:translateY(-50%);width:20px;height:20px;stroke:var(--muted);fill:none;stroke-width:1.7;stroke-linecap:round;pointer-events:none}
    .filterbar input[type=search]{width:100%;min-height:46px;margin:0;padding:.55rem .9rem .55rem 2.6rem;border:1px solid #b6c3da;border-radius:12px;background:#fff;font:inherit}
    .fb-chips{display:flex;flex-wrap:wrap;gap:.45rem;align-items:center}
    .fb-chips .lbl{font-size:.85rem;font-weight:700;color:var(--muted);margin-right:.2rem}
    .fb-chips .sep{width:1px;height:1.6rem;background:var(--line);margin:0 .4rem}
    .filterbar button.chip{min-height:38px;padding:.25rem .95rem;border-radius:999px;background:#fff;color:var(--navy);border:1.5px solid #b6c3da;font-weight:600;font-size:.92rem;margin:0}
    .filterbar button.chip:hover{border-color:var(--brand);background:var(--accent);color:var(--brand)}
    .filterbar button.chip[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:#fff}
    .filterbar button.chip.warn[aria-pressed="true"]{background:#8a5a00;border-color:#8a5a00}
    .fb-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:.7rem .9rem;align-items:end}
    .filterbar label{display:flex;flex-direction:column;font-size:.82rem;font-weight:700;color:var(--muted);gap:.2rem}
    .filterbar .fb-grid input,.filterbar .fb-grid select{width:100%;min-height:42px;margin:0;padding:.4rem .6rem;border:1px solid #b6c3da;border-radius:10px;font:inherit;font-weight:400;color:var(--navy);background:#fff}
    .fb-actions{display:flex;gap:.5rem;align-items:center;justify-content:flex-end}
    @media (max-width:640px){.fb-search{flex-direction:column}.fb-chips .sep{display:none}}
    .pager{display:flex;flex-wrap:wrap;gap:.6rem;align-items:center;margin:-.9rem 0 1.5rem}
    .pager .info{color:var(--muted);font-size:.9rem}
    #t-incident td.desc{max-width:18rem}
    #t-incident td.desc>div{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
    #t-incident td small.sub{display:block;color:#555;margin-top:.15rem}
    .sr{position:absolute;left:-9999px}
    #t-incident td button{white-space:nowrap}
    /* แถบ Flow 4 ขั้นตอน */
    ol.flow{display:flex;list-style:none;padding:0;margin:.6rem 0 1rem}
    ol.flow li.step{flex:1;position:relative;display:flex;flex-direction:column;align-items:center;text-align:center;gap:.1rem;padding:0 .25rem}
    ol.flow li.step::before{content:"";position:absolute;top:17px;right:50%;width:100%;height:4px;background:var(--line);z-index:0}
    ol.flow li.step:first-child::before{display:none}
    ol.flow li.step.done::before,ol.flow li.step.current::before{background:var(--ok)}
    ol.flow .dot{position:relative;z-index:1;width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;background:#fff;border:3px solid #9aa6bb;color:var(--muted)}
    ol.flow .done .dot{background:var(--ok);border-color:var(--ok);color:#fff}
    ol.flow .current .dot{background:var(--brand);border-color:var(--brand);color:#fff;box-shadow:0 0 0 5px var(--accent)}
    ol.flow .lbl{font-weight:700}
    ol.flow .todo .lbl{color:var(--muted);font-weight:600}
    ol.flow small{color:var(--muted);font-size:.82rem}
    @media (max-width:640px){
      ol.flow{flex-direction:column;gap:.2rem}
      ol.flow li.step{flex-direction:row;align-items:center;text-align:left;gap:.2rem .7rem;padding:.3rem 0;flex-wrap:wrap}
      ol.flow li.step::before{display:none}
    }
    @media (max-width:640px){#detail dl{grid-template-columns:1fr}#detail dt{margin-top:.5rem;color:var(--muted);font-size:.9rem}}
    .nextbox{background:var(--accent);border-left:5px solid var(--brand);border-radius:8px;padding:.7rem 1rem;margin:0 0 1rem}
    .nextbox .now{font-size:1.1rem;font-weight:700;color:var(--brand)}
    .nextbox div{margin-top:.2rem}
    .alertbox{background:#fff4d6;border-left:5px solid #e0b43a;border-radius:8px;padding:.6rem 1rem;margin:0 0 1rem}
    .group{border:1px solid var(--line);border-radius:10px;padding:.2rem 1rem .9rem;margin:.8rem 0}
    .group h4{margin:.7rem 0 .4rem;color:var(--brand)}
    .editgrid small.hint{display:block;color:var(--muted);font-size:.88rem;margin:.15rem 0 0}
    details.editdet,details.histdet{border:1px solid var(--line);border-radius:10px;margin:1rem 0;background:#fafbfe}
    details.editdet>summary,details.histdet>summary{cursor:pointer;padding:.8rem 1rem;font-weight:700;color:var(--brand);list-style:none;min-height:44px;display:flex;align-items:center}
    details.editdet>summary::before,details.histdet>summary::before{content:"▸";margin-right:.6rem;transition:transform .15s}
    details[open]>summary::before{transform:rotate(90deg)}
    details.editdet>div,details.histdet>div{padding:0 1rem 1rem}
    .steps123{margin:.2rem 0 .6rem;padding-left:1.3rem}
    .previewbox{background:#fff;border:2px dashed var(--brand);border-radius:8px;padding:.5rem .9rem;margin:1rem 0}
    .previewbox .t{font-weight:700;color:var(--brand)}
    dialog#expdlg{width:min(860px,96vw);max-height:92vh;overflow:auto;border:1px solid var(--line);border-radius:12px;padding:0 1.2rem}
    dialog#expdlg::backdrop{background:rgba(0,0,0,.45)}
    .exphead{display:flex;justify-content:space-between;align-items:center;gap:1rem;position:sticky;top:0;background:#fff;padding:.8rem 0;border-bottom:1px solid var(--line);z-index:2}
    .exphead h3{margin:0}
    .presetbar{display:flex;align-items:center;gap:.8rem;flex-wrap:wrap;background:#f4f7fb;border-radius:10px;padding:.5rem .9rem;margin:.9rem 0 .3rem}
    .presetbar label{font-weight:600;color:var(--muted);white-space:nowrap}
    .presetbar select{flex:1;min-width:200px;margin:0}
    .stephead{display:flex;align-items:center;gap:.6rem;margin:1.3rem 0 .5rem}
    .stephead h4{margin:0;font-size:1.05rem;color:var(--ink,#14213d)}
    .stepno{display:inline-flex;align-items:center;justify-content:center;width:1.7rem;height:1.7rem;border-radius:50%;background:var(--brand);color:#fff;font-weight:700;font-size:.9rem;flex:none}
    .filsum{background:#eef4fc;border-left:5px solid var(--brand);border-radius:8px;padding:.55rem .9rem;font-weight:600}
    .filsum small{display:block;font-weight:400;color:var(--muted);margin-top:.2rem}
    .modes{display:grid;grid-template-columns:1fr 1fr;gap:.7rem}
    .modecard{display:flex;gap:.6rem;align-items:flex-start;font-weight:400;border:2px solid var(--line);border-radius:10px;padding:.7rem .8rem;cursor:pointer;background:#fff}
    .modecard:has(input:checked){border-color:var(--brand);background:#eef4fc}
    .modecard input{margin-top:.2rem}
    .modecard span{display:flex;flex-direction:column;gap:.15rem}
    .modecard small{color:var(--muted)}
    .expcount{color:var(--muted);font-weight:400;font-size:.92rem}
    .quick{display:flex;gap:1rem;flex-wrap:wrap;margin:0 0 .3rem}
    details.grp{border:1px solid var(--line);border-radius:10px;margin:.5rem 0;background:#fff}
    details.grp>summary{cursor:pointer;list-style:none;display:flex;align-items:center;justify-content:space-between;gap:.8rem;padding:.55rem .9rem;min-height:44px;font-weight:700}
    details.grp>summary::before{content:"▸";margin-right:.5rem;color:var(--brand);transition:transform .15s}
    details.grp[open]>summary::before{transform:rotate(90deg)}
    details.grp>summary .gname{flex:1}
    .gbadge{font-weight:600;font-size:.82rem;color:var(--muted);background:#eef1f6;border-radius:999px;padding:.05rem .6rem}
    .gbadge.on{background:#dbeafe;color:#0b3d91}
    .grpbody{padding:0 .9rem .8rem}
    .expcols{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:.05rem .8rem}
    .expcol{display:flex;align-items:center;min-height:34px;font-weight:400}
    .expcol.allrow{font-weight:600;color:var(--brand)}
    .expcol.pii{color:#8a4b00}
    details.savebox{background:#fafbfd;border-style:dashed;margin-top:1.3rem}
    details.savebox>summary{font-weight:600;color:var(--muted)}
    .exprow{display:grid;grid-template-columns:6rem 1fr;gap:.6rem;align-items:center;margin:.4rem 0}
    .expstat{margin:.4rem 0;font-weight:600}
    .expstat:empty{display:none}
    .expstat.good{color:#1b6e2f}.expstat.bad{color:#b3261e}
    .dirty{color:#8a4b00;font-weight:600;font-size:.85rem}
    .expfoot{position:sticky;bottom:0;background:#fff;display:flex;align-items:center;gap:1rem;flex-wrap:wrap;padding:.8rem 0;margin-top:1rem;border-top:1px solid var(--line)}
    .expfoot button{min-width:13rem}
    .expsum{color:var(--muted)}
    @media(max-width:600px){.modes{grid-template-columns:1fr}.exprow{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <header>
    <h1>SHE Portal</h1>
    <nav>
      <a href="index.html">หน้าแรก</a>
      <a href="incident.html">รายงานอุบัติเหตุ</a>
      <a href="checklist.html">เช็กลิสต์ตรวจ</a>
      <a href="training.html">บันทึกการอบรม</a>
      <a href="records.html">ดูข้อมูล</a>
      <a href="login.html">เข้าสู่ระบบ</a>
    </nav>
  </header>

  <main>
    <h2>ดูข้อมูลที่บันทึกแล้ว</h2>
    <p id="msg" role="status" class="msg" hidden></p>
    <p><small>ระบบแสดงเฉพาะข้อมูลที่คุณมีสิทธิ์ดู พนักงานทั่วไปเห็นเฉพาะรายงานของตัวเอง</small></p>

    <h3>รายงานอุบัติเหตุ</h3>
    <form id="filterbar" class="filterbar" aria-label="ตัวกรองรายงานอุบัติเหตุ"></form>
    <div class="tablewrap"><table id="t-incident"></table></div>
    <nav id="pager" class="pager" aria-label="เปลี่ยนหน้า"></nav>
    <section id="detail" aria-live="polite" hidden></section>
    <dialog id="reqdlg" aria-labelledby="reqdlg-t"></dialog>
  <dialog id="expdlg" aria-labelledby="expdlg-t"></dialog>

    <h3>เช็กลิสต์ตรวจ</h3>
    <div class="tablewrap"><table id="t-checklist"></table></div>

    <h3>บันทึกการอบรม</h3>
    <div class="tablewrap"><table id="t-training"></table></div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script src="config.js"></script>
  <script src="auth.js"></script>
  <script>
    requireLogin();
    const msg = document.getElementById("msg");
    function showMsg(text, ok) {
      msg.textContent = text; msg.className = "msg " + (ok ? "ok" : "error"); msg.hidden = false;
      msg.scrollIntoView({ block: "nearest" });
    }

    // สร้าง element ด้วย createElement + textContent (ไม่ใช้ innerHTML) กัน XSS (OWASP A03)
    function h(tag, attrs, ...kids) {
      const e = document.createElement(tag);
      Object.entries(attrs || {}).forEach(([k, v]) => {
        if (v === false || v == null) return;
        if (k === "text") e.textContent = v;
        else if (k === "class") e.className = v;
        else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
        else e.setAttribute(k, v === true ? "" : v);
      });
      kids.flat().forEach((c) => { if (c != null) e.append(c.nodeType ? c : document.createTextNode(String(c))); });
      return e;
    }

    function render(tableId, headers, rows) {
      const table = document.getElementById(tableId);
      table.replaceChildren();
      const thead = table.createTHead().insertRow();
      headers.forEach((t) => { const th = document.createElement("th"); th.textContent = t; thead.appendChild(th); });
      const tbody = table.createTBody();
      if (rows.length === 0) {
        const td = tbody.insertRow().insertCell();
        td.colSpan = headers.length;
        td.textContent = "ยังไม่มีข้อมูลที่คุณมีสิทธิ์เห็น";
        return;
      }
      rows.forEach((r) => {
        const tr = tbody.insertRow();
        r.forEach((v) => { const td = tr.insertCell(); if (v && v.nodeType) td.appendChild(v); else td.textContent = v ?? ""; });
      });
    }

    // แสดงเวลาที่บันทึก (DB เก็บเป็น UTC) ตามเขตเวลาของอุปกรณ์ผู้ใช้ (รองรับหลายประเทศ ไม่ฝังเวลาไทย)
    function fmtTime(v) {
      if (!v) return "";
      return new Date(v).toLocaleString("en-GB", { hour12: false, year: "numeric", month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit" });
    }

    async function load(table, order, cols, tableId, headers, toRow) {
      const { data, error } = await sb.from(table).select(cols)
        .order(order, { ascending: false }).order("created_at", { ascending: false }).limit(50);
      if (error) { showMsg("โหลดข้อมูลไม่สำเร็จ: " + error.message, false); return; }
      render(tableId, headers, data.map(toRow));
    }

    // ---------- รายการตัวเลือก (Master list) ----------
    let LK = {}, TYPES = [];
    async function loadMasters() {
      const a = await sb.from("lookup_values").select("kind, code, name_th, sort_order")
        .eq("active", true).order("sort_order").order("code");
      LK = {};
      (a.data || []).forEach((r) => { (LK[r.kind] = LK[r.kind] || []).push(r); });
      const t = await sb.from("incident_types").select("id, code, name_th").eq("active", true).order("sort_order");
      TYPES = t.data || [];
    }
    const lkName = (kind, code) => { const f = (LK[kind] || []).find((x) => x.code === code); return f ? f.name_th : code; };
    const typeName = (id) => { const f = TYPES.find((x) => x.id === id); return f ? f.name_th : id; };

    // ---------- นิยามฟิลด์ที่แก้ได้ (ต้องตรงกับ whitelist ใน incident_editable_fields ของฐานข้อมูล) ----------
    const LBL = {
      occurred_on: "วันที่เกิดเหตุ", occurred_time: "เวลาเกิดเหตุ", location: "จุดเกิดเหตุ", description: "เกิดอะไรขึ้น",
      incident_type_id: "ประเภทเหตุการณ์", department_text: "แผนก", how_text: "เกิดขึ้นอย่างไร (How)",
      why_text: "ทำไมจึงเกิด (Why)", immediate_action: "การดำเนินการทันที", high_hazard_code: "High hazard",
      system_failure_code: "System / Program failure", root_cause_code: "Root cause", is_recordable: "Recordable",
      is_serious_potential: "Serious / Potentially serious", role_in_case: "บทบาท", injury_type_code: "ชนิดการบาดเจ็บ",
      body_part_codes: "ตำแหน่งที่บาดเจ็บ", phase: "สถานะ"
    };
    const ROLE_TH = { injured: "ผู้บาดเจ็บ", witness: "พยาน", other: "อื่น ๆ" };
    // mgr = เฉพาะ SHE/Admin ของ Plant (ตรงกับ incident_classify_guard) ; req = จำเป็นต้องมีค่า (คอลัมน์ NOT NULL)
    const REPORT_FIELDS = [
      { k: "occurred_on", t: "date", req: true }, { k: "occurred_time", t: "time" },
      { k: "location", t: "text", req: true }, { k: "description", t: "area", req: true },
      { k: "incident_type_id", t: "type", req: true }, { k: "department_text", t: "text" },
      { k: "how_text", t: "area" }, { k: "why_text", t: "area" }, { k: "immediate_action", t: "area" },
      { k: "high_hazard_code", t: "lk", kind: "high_hazard" },
      { k: "system_failure_code", t: "lk", kind: "system_failure", mgr: true },
      { k: "root_cause_code", t: "lk", kind: "root_cause", mgr: true },
      { k: "is_recordable", t: "bool", mgr: true }, { k: "is_serious_potential", t: "bool", mgr: true }
    ];
    const PERSON_FIELDS = [
      { k: "role_in_case", t: "role", req: true }, { k: "injury_type_code", t: "lk", kind: "injury_type" },

    function fmtVal(k, v) {
      if (v === null || v === undefined || v === "" || (Array.isArray(v) && !v.length)) return "—";
      if (typeof v === "boolean") return v ? "ใช่" : "ไม่ใช่";
      if (k === "incident_type_id") return typeName(v);
      if (k === "occurred_time") return String(v).slice(0, 5);
      if (k === "role_in_case") return ROLE_TH[v] || v;
      if (k === "phase") return v === "closed" ? "Closed" : "Open";
      if (k === "body_part_codes") return v.map((c) => lkName("body_part", c)).join(", ");
      const f = REPORT_FIELDS.concat(PERSON_FIELDS).find((x) => x.k === k);
      if (f && f.t === "lk") return lkName(f.kind, v);
      return String(v);
    }
    const norm = (k, v) => {
      if (Array.isArray(v)) return v.length ? JSON.stringify([...v].sort()) : null;
      if (k === "occurred_time" && v) return String(v).slice(0, 5);
      if (v === "" || v === undefined) return null;
      return v;
    };
    const same = (k, a, b) => norm(k, a) === norm(k, b);

    // ---------- สร้างช่องกรอกของแต่ละฟิลด์ ----------
    function makeInput(f, cur, idPrefix) {
      const id = idPrefix + f.k;
      let control, get;
      const opts = (list, curVal) => {
        const s = h("select", { id }); s.append(h("option", { value: "", text: "— ไม่ระบุ —" }));
        list.forEach((o) => s.append(h("option", { value: o.code, text: o.name_th })));
        if (curVal && !list.some((o) => o.code === curVal)) s.append(h("option", { value: curVal, text: curVal + " (ไม่ active)" }));
        s.value = curVal || ""; return s;
      };
      if (f.t === "date" || f.t === "time" || f.t === "text") {
        control = h("input", { id, type: f.t });
        control.value = f.t === "time" ? (cur ? String(cur).slice(0, 5) : "") : (cur ?? "");
        get = () => (control.value.trim() === "" ? null : control.value.trim());
      } else if (f.t === "area") {
        control = h("textarea", { id }); control.value = cur ?? "";
        get = () => (control.value.trim() === "" ? null : control.value.trim());
      } else if (f.t === "type") {
        control = h("select", { id });
        TYPES.forEach((o) => control.append(h("option", { value: o.id, text: o.name_th })));
        if (cur && !TYPES.some((o) => o.id === cur)) control.append(h("option", { value: cur, text: "(ประเภทที่ปิดใช้งาน)" }));
        control.value = cur || ""; get = () => control.value || null;
      } else if (f.t === "lk") {
        control = opts(LK[f.kind] || [], cur); get = () => control.value || null;
      } else if (f.t === "role") {
        control = h("select", { id });
        Object.entries(ROLE_TH).forEach(([v, t]) => control.append(h("option", { value: v, text: t })));
        control.value = cur || "injured"; get = () => control.value;
      } else if (f.t === "bool") {
        control = h("select", { id });
        [["", "— ไม่ระบุ —"], ["true", "ใช่"], ["false", "ไม่ใช่"]].forEach(([v, t]) => control.append(h("option", { value: v, text: t })));
        control.value = cur === true ? "true" : cur === false ? "false" : "";
        get = () => (control.value === "" ? null : control.value === "true");
      } else if (f.t === "multi") {
        const list = LK[f.kind] || []; const have = new Set(cur || []);
        control = h("div", { id, role: "group" });
        const boxes = [];
        const all = list.concat([...have].filter((c) => !list.some((o) => o.code === c)).map((c) => ({ code: c, name_th: c + " (ไม่ active)" })));
        all.forEach((o) => {
          const cb = h("input", { type: "checkbox", value: o.code }); cb.checked = have.has(o.code); boxes.push(cb);
          control.append(h("label", { class: "chk" }, cb, o.name_th));
        });
        get = () => { const v = boxes.filter((b) => b.checked).map((b) => b.value); return v.length ? v : null; };
      }
      const hint = HINT[f.k] ? h("small", { class: "hint", id: id + "-h", text: HINT[f.k] }) : null;
      if (hint) control.setAttribute("aria-describedby", id + "-h");
      return { control, get, hint, label: h("label", { for: id, text: LBL[f.k] + (f.req ? " *" : "") }) };
    }

    // ---------- สรุปการเปลี่ยนแปลง ----------
    function describeChanges(changes, mapOld) {
      // changes: {report:{k:v | {old,new}}, persons:{id:{k:...}}}; mapOld(scope,id,k) คืนค่าเดิมกรณีเป็นคำขอ (ยังไม่มี old)
      const out = [];
      const line = (label, k, v, scope, pid) => {
        const isDiff = v && typeof v === "object" && !Array.isArray(v) && ("old" in v || "new" in v);
        const nw = isDiff ? v.new : v;
        const old = isDiff ? v.old : (mapOld ? mapOld(scope, pid, k) : undefined);
        out.push(label + ": " + (old === undefined ? "" : fmtVal(k, old) + " → ") + fmtVal(k, nw));
      };
      Object.entries(changes.report || {}).forEach(([k, v]) => line(LBL[k] || k, k, v, "report"));
      Object.entries(changes.persons || {}).forEach(([pid, fs]) => {
        const n = (state.persons.findIndex((p) => p.id === pid) + 1) || "?";
        Object.entries(fs).forEach(([k, v]) => line("ผู้เกี่ยวข้อง #" + n + " · " + (LBL[k] || k), k, v, "person", pid));
      });
      return out;
    }

    // แปลข้อความ error ของ RPC เป็นภาษาไทย (ข้อความจริงมาจากฐานข้อมูล; สิทธิ์จริงบังคับที่ฐานข้อมูลเสมอ)
    function errTh(e) {
      const m = (e && e.message) || "";
      const map = [
        [/Reason must be/i, "เหตุผลต้องมีอย่างน้อย 10 ตัวอักษร"], [/note is required/i, "การปฏิเสธต้องระบุหมายเหตุ"],
        [/closed/i, "รายงานถูกปิดแล้ว ต้องให้ Admin เปิดใหม่ (Reopen) ก่อนจึงจะแก้ได้"], [/No changes/i, "ไม่มีการเปลี่ยนแปลงจากค่าเดิม"],
        [/Cannot decide your own/i, "ไม่สามารถอนุมัติ/ปฏิเสธคำขอของตัวเองได้"], [/duplicate key/i, "คุณมีคำขอที่รอดำเนินการของรายงานนี้อยู่แล้ว"],
        [/Only the reporter/i, "เฉพาะผู้รายงานเท่านั้นที่ขอแก้ไขได้"], [/Only SHE|Only Admin|permission|42501/i, "คุณไม่มีสิทธิ์ทำรายการนี้"],
        [/Invalid .*code|check constraint|violates/i, "ข้อมูลไม่ถูกต้องตามกติกาของระบบ: " + m],
        [/not editable/i, "ฟิลด์นี้ไม่อนุญาตให้แก้ไข"], [/is deleted/i, "รายงานนี้ถูกลบแล้ว"]
      ];
      const hit = map.find(([re]) => re.test(m));
      return hit ? hit[1] : "ดำเนินการไม่สำเร็จ: " + m;
    }

    // ---------- รายงานอุบัติเหตุ: ตาราง + แผงรายละเอียด ----------
    let me = null, pendingCount = {}, pendingSum = {}, lastReq = {}, detailId = null, dlgInc = null;

    // ---------- ตัวกรอง + แบ่งหน้า (กรองที่ฐานข้อมูล ไม่ดึงทั้งหมดมากรองในเบราว์เซอร์) ----------
    const PAGE = 25;
    const flt = { from: "", to: "", plant: "", type: "", stage: "", req: "", q: "", page: 0 };
    let PLANTS = [], totalRows = 0;
    const STAGE_OPTS = [["", "ทุกขั้นตอน"], ["flash", "รอ SHE ตรวจสอบ"], ["investigation", "กำลังสอบสวน"], ["closed", "ปิดเคสแล้ว"]];
    const SVG_SEARCH = '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-4.2-4.2"/></svg>';
    function buildFilterBar() {
      const f = document.getElementById("filterbar"); f.replaceChildren();
      const apply = () => { flt.page = 0; loadIncidents(); };

      // แถวที่ 1: ค้นหา
      const q = h("input", { id: "f-q", type: "search", placeholder: "ค้นหาจากจุดเกิดเหตุหรือรายละเอียด…", "aria-label": "ค้นหาจากจุดเกิดเหตุหรือรายละเอียด", maxlength: "100" });
      q.value = flt.q;

      f.append(h("div", { class: "fb-search" }, box, h("button", { type: "submit", text: "ค้นหา" })));
      // แถวที่ 2: ปุ่มเลือกขั้นตอน (+ คำขอรอพิจารณา สำหรับ SHE/Admin)

      f.onsubmit = (e) => { e.preventDefault(); flt.q = q.value.trim(); apply(); };
    }
    function renderPager() {
      const nav = document.getElementById("pager"); nav.replaceChildren();
      const pages = Math.max(1, Math.ceil(totalRows / PAGE));
      nav.append(h("span", { class: "info", text: totalRows ? "ทั้งหมด " + totalRows + " รายการ · หน้า " + (flt.page + 1) + " / " + pages : "ไม่พบรายการตามเงื่อนไข" }));

    // สร้าง query พร้อมเงื่อนไขกรองปัจจุบัน (ใช้ร่วมกันทั้งแสดงตารางและ Export) — สิทธิ์จริงยังถูกบังคับโดย RLS
    async function filteredQuery(cols, withCount) {
      let pendIds = null;
      if (flt.req === "pending") {
        const p = await sb.from("incident_edit_requests").select("incident_id").eq("status", "pending").limit(1000);
        pendIds = [...new Set((p.data || []).map((x) => x.incident_id))];
      }
      let q = sb.from("incident_reports").select(cols, withCount ? { count: "exact" } : undefined);
      if (flt.from) q = q.gte("occurred_on", flt.from);
      if (flt.to) q = q.lte("occurred_on", flt.to);
      if (flt.plant) q = q.eq("plant_id", flt.plant);
      if (flt.type) q = q.eq("incident_type_id", flt.type);
      if (flt.stage) q = q.eq("phase", flt.stage);
      if (pendIds) q = pendIds.length ? q.in("id", pendIds) : q.eq("id", "00000000-0000-0000-0000-000000000000");
      const term = flt.q.replace(/[,()%*\\_]/g, " ").trim();   // ตัดอักขระพิเศษของ PostgREST filter ออก
      if (term) q = q.or("location.ilike.%" + term + "%,description.ilike.%" + term + "%");
      // ห่อใน object: query ของ supabase-js เป็น thenable ถ้า return ตรง ๆ จาก async function จะถูก await (รันไปเลย) ก่อนต่อ .range()
      return { q: q.order("occurred_on", { ascending: false }).order("created_at", { ascending: false }) };
    }

    const EXPORT_MAX = 5000;

    function csvCell(v) {
      let t = v === null || v === undefined ? "" : String(v);
      if (/^[=+\-@\t\r]/.test(t)) t = "'" + t;
      return /[",\r\n]/.test(t) ? '"' + t.replace(/"/g, '""') + '"' : t;
    }

    const PROLE = { injured: "ผู้บาดเจ็บ/ผู้ได้รับผลกระทบ", witness: "พยาน", other: "อื่น ๆ" };
    const REQ_LABEL = { pending: "รอ SHE พิจารณา", approved: "อนุมัติแล้ว", rejected: "ไม่อนุมัติ", cancelled: "ยกเลิกแล้ว" };
    const yn = (v) => (v === true ? "ใช่" : v === false ? "ไม่ใช่" : "");
    const two = (n) => String(n).padStart(2, "0");
    // เวลาแสดงตามเขตเวลาของเครื่องผู้ส่งออก (หลักการ Global-ready: ไม่ฝังเวลาไทย)
    const fmtLocal = (iso) => { if (!iso) return ""; const d = new Date(iso); return isNaN(d) ? "" : d.getFullYear() + "-" + two(d.getMonth() + 1) + "-" + two(d.getDate()) + " " + two(d.getHours()) + ":" + two(d.getMinutes()); };
    const PL = "plants(code,name,country_code,company_name,business_unit,site_type)", TY = "incident_types(name_th)";
    const EX_GROUPS = [
      ["core", "ข้อมูลเคสและ Plant"], ["detail", "รายละเอียดเหตุการณ์ (5W1H)"], ["cls", "การจำแนกโดย SHE"],
      ["follow", "ติดตามผล"], ["person", "ผู้เกี่ยวข้อง / ผู้บาดเจ็บ"]
    ];
    // c = ค่าระดับเคส, p = ค่าระดับผู้เกี่ยวข้อง, f = ฟิลด์ที่ต้องดึง (ดึงเฉพาะที่เลือก), pii = ข้อมูลระบุตัวตน (เลือกได้เฉพาะ SHE/Admin)
    const COLS = [
      { k: "id", g: "core", l: "รหัสเคส (ID)", f: ["id"], c: (r) => r.id },
      { k: "occurred_on", g: "core", l: "วันที่เกิดเหตุ", f: ["occurred_on"], c: (r) => r.occurred_on },

      // ===== ท้าย: ปุ่มหลัก (sticky) =====
      const err = h("p", { class: "expstat bad", id: "exp-err", role: "alert", hidden: true });

      sel.addEventListener("change", () => {

        buildFilterBar(); loadIncidents();                                   // ตารางด้านหลังปรับตามตัวกรองของ preset ด้วย
        EXP.base = { id: p.id, snap: expSnapshot() };
        const skipped = keys.length - ok.length;
        EXP.pmsg = "โหลดชุด “" + p.name + "” แล้ว" + (skipped ? " (ข้าม " + skipped + " คอลัมน์ที่ไม่มีหรือไม่มีสิทธิ์ใช้)" : "");
        EXP.openSave = false; renderExport();
      });
      function sync() {
        COLS.forEach((c) => { const cb = document.getElementById("exp-c-" + c.k); if (cb) cb.checked = EXP.cols.has(c.k) && colAvail(c); });
        EX_GROUPS.forEach(([g]) => {

          const n = all.filter((c) => EXP.cols.has(c.k)).length, b = dlg.querySelector('[data-gb="' + g + '"]');
          b.textContent = n + " / " + all.length; b.classList.toggle("on", n > 0);
        });
        const n = orderedCols().length;

        sum.textContent = n + " คอลัมน์ · " + (EXP.mode === "person" ? "1 แถวต่อผู้เกี่ยวข้อง" : "1 แถวต่อเคส");
        dlg.querySelectorAll('input[name="exp-mode"]').forEach((i) => { i.checked = i.value === EXP.mode; });
        if (EXP.id && cur() && (!EXP.base || EXP.base.id !== EXP.id)) EXP.base = { id: EXP.id, snap: presetSnapshot(cur()) };
        const dirty = !!cur() && !!EXP.base && expSnapshot() !== EXP.base.snap;
        dirtyBadge.hidden = !dirty;
        document.getElementById("exp-curname").textContent = cur() ? "ชุดที่กำลังใช้: “" + cur().name + "” — “บันทึก” จะทับชุดนี้ ส่วน “บันทึกเป็นชุดใหม่” จะสร้างชุดเพิ่ม" : "ยังไม่ได้เลือกชุด — ตั้งชื่อแล้วกด “บันทึกเป็นชุดใหม่”";
        btnSave.disabled = !EXP.id; btnDel.disabled = !EXP.id;
        err.hidden = true;
      }
      if (EXP.pmsg) { setP(pTop, EXP.pmsg, true); EXP.pmsg = ""; }
      if (EXP.pmsg2) { setP(pSave, EXP.pmsg2, true); EXP.pmsg2 = ""; }
      EXP.openSave = false;
      sync();
    }

    // ดึงข้อมูลเป็นชุด ๆ (ไม่ใส่ id ยาวเกินใน URL)
    async function inChunks(table, cols, key, ids, orderCol) {
      const out = [];
      for (let i = 0; i < ids.length; i += 100) {
        let q = sb.from(table).select(cols).in(key, ids.slice(i, i + 100));
        if (orderCol) q = q.order(orderCol);
        const { data, error } = await q;
        if (error) throw error;
        out.push(...(data || []));
      }
      return out;
    }

    async function runExport() {
      const btn = document.getElementById("exp-go"), err = document.getElementById("exp-err");
      const fail = (t) => { err.textContent = t; err.hidden = false; };
      const cols = COLS.filter((c) => EXP.cols.has(c.k) && colAvail(c));
      err.hidden = true;
      if (!cols.length) return fail("กรุณาเลือกคอลัมน์อย่างน้อย 1 รายการ");
      const perCols = cols.filter(isPersonCol);
      if (EXP.mode === "person" && !perCols.length) return fail("โหมด B ต้องเลือกคอลัมน์กลุ่มผู้เกี่ยวข้องอย่างน้อย 1 รายการ");
      btn.disabled = true; const old = btn.textContent; btn.textContent = "กำลังเตรียมไฟล์…";
      try {
        // ดึงเฉพาะฟิลด์ที่เลือก (data minimization): id เสมอ + ฟิลด์ของคอลัมน์ที่เลือก
        const sel = new Set(["id"]); cols.forEach((c) => (c.f || []).forEach((f) => sel.add(f)));
        const cases = [];
        for (let from = 0; from < EXPORT_MAX; from += 1000) {
          const { q } = await filteredQuery(Array.from(sel).join(", "), false);
          const { data, error } = await q.range(from, from + 999);
          if (error) return fail("ส่งออกไม่สำเร็จ: " + error.message);
          cases.push(...(data || []));
          if (!data || data.length < 1000) break;
        }
        const ids = cases.map((r) => r.id);
        const x = { per: {}, req: {} };
        const needPersons = cols.some((c) => c.need === "persons" || isPersonCol(c));
        if (needPersons && ids.length) {
          const pf = new Set(["incident_id", "role_in_case", "created_at"]); perCols.forEach((c) => c.pf.forEach((f) => pf.add(f)));
          (await inChunks("incident_persons", Array.from(pf).join(", "), "incident_id", ids, "created_at")).forEach((p) => { (x.per[p.incident_id] = x.per[p.incident_id] || []).push(p); });
        }
        if (cols.some((c) => c.need === "req") && ids.length) {
          (await inChunks("incident_edit_requests", "incident_id, status, decision_note, created_at", "incident_id", ids, "created_at"))
            .forEach((r) => { x.req[r.incident_id] = r; });   // เรียงเก่า→ใหม่ แล้วเขียนทับ = ล่าสุดชนะ
        }
        const lines = [cols.map((c) => csvCell(c.l)).join(",")];
        let nrows = 0;
        cases.forEach((r) => {
          const list = x.per[r.id] || [];
          const emit = (per) => {
            lines.push(cols.map((c) => csvCell(isPersonCol(c) ? (EXP.mode === "person" ? (per ? c.p(per) : "") : list.map(c.p).join(" ; ")) : c.c(r, x))).join(","));
            nrows++;
          };
          if (EXP.mode === "person") { if (list.length) list.forEach(emit); else emit(null); } else emit(null);
        });
        const blob = new Blob(["﻿" + lines.join("\r\n")], { type: "text/csv;charset=utf-8" });   // BOM ให้ Excel อ่านภาษาไทยถูกต้อง
        const d = new Date();
        const a = h("a", { href: URL.createObjectURL(blob), download: "she-incidents-" + (EXP.mode === "person" ? "per-person-" : "per-case-") + d.getFullYear() + two(d.getMonth() + 1) + two(d.getDate()) + "-" + two(d.getHours()) + two(d.getMinutes()) + ".csv" });
        document.body.append(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000);
        const m = "ส่งออก " + nrows + " แถว จาก " + cases.length + " เคส เรียบร้อย" + (cases.length >= EXPORT_MAX ? " (จำกัดสูงสุด " + EXPORT_MAX + " เคส กรุณาแคบตัวกรองแล้วส่งออกใหม่)" : "");
        showMsg(m, true);
        const ps = document.getElementById("exp-pstat"); ps.textContent = m; ps.className = "expstat good";
      } catch (e) { fail("ส่งออกไม่สำเร็จ: " + (e && e.message ? e.message : e)); }
      finally { btn.disabled = false; btn.textContent = old; }
    }

    async function loadIncidents() {
      const { q } = await filteredQuery("id, reporter_id, phase, deleted_at, occurred_on, occurred_time, location, type, description, created_at, plants(code), incident_types(name_th)", true);
      const { data, error, count } = await q.range(flt.page * PAGE, flt.page * PAGE + PAGE - 1);
      if (error) { showMsg("โหลดข้อมูลไม่สำเร็จ: " + error.message, false); return; }
      totalRows = typeof count === "number" ? count : (data || []).length;
      if (!(data || []).length && flt.page > 0) { flt.page = 0; return loadIncidents(); }
      // ดึงคำขอแก้ไขเฉพาะรายงานที่แสดงอยู่ในหน้านี้
      const ids = data.map((r) => r.id);
      const rq = ids.length ? await sb.from("incident_edit_requests").select("incident_id, status, changes, decision_note, created_at")
        .in("incident_id", ids).order("created_at", { ascending: false }) : { data: [] };
      pendingCount = {}; pendingSum = {}; lastReq = {};
      (rq.data || []).forEach((r) => {
        if (!lastReq[r.incident_id]) lastReq[r.incident_id] = r;   // เรียงใหม่สุดก่อน → ตัวแรกคือล่าสุด
        if (r.status !== "pending") return;
        pendingCount[r.incident_id] = (pendingCount[r.incident_id] || 0) + 1;
        const set = (pendingSum[r.incident_id] = pendingSum[r.incident_id] || new Set());

        data.map((r) => [
          h("div", {}, r.occurred_on + (r.occurred_time ? " " + r.occurred_time.slice(0, 5) : ""),

          r.incident_types ? r.incident_types.name_th : r.type,
          r.location,
          h("div", { title: r.description || "", text: r.description || "" }),
          statusBadge(r),
          pendCell(r),
          fmtTime(r.created_at),
          h("button", { type: "button", class: "small", text: "เปิดดู", "aria-label": "เปิดดูรายงาน " + r.occurred_on + " " + r.location, onclick: () => openDetail(r.id) })
        ]));
      document.querySelectorAll("#t-incident tbody tr").forEach((tr, i) => {
        if (tr.cells[3]) tr.cells[3].classList.add("desc");
        // ไฮไลต์แถวที่ SHE/Admin ต้องลงมือ (มีคำขอรอพิจารณา)
        if (isMgrRole() && data[i] && pendingCount[data[i].id]) tr.classList.add("needs-action");
      });
      renderPager();

    // คอลัมน์ "คำขอแก้ไข": SHE/Admin เห็นสรุปว่าขอแก้อะไร และกดเพื่อพิจารณาได้ทันทีโดยไม่ต้องเปิดรายงาน
    // ถ้าไม่มีคำขอค้าง จะแสดงผลของคำขอล่าสุด (อนุมัติ/ไม่อนุมัติ/ยกเลิก) ด้วยสีที่ต่างกัน
    const RST = { approved: "อนุมัติแล้ว", rejected: "ไม่อนุมัติ", cancelled: "ยกเลิกแล้ว" };
    function pendCell(r) {
      const n = pendingCount[r.id];
      if (!n) {
        const l = lastReq[r.id]; if (!l || !RST[l.status]) return "";
        return h("div", {}, h("span", { class: "badge " + l.status, text: (l.status === "rejected" ? "✕ " : l.status === "approved" ? "✓ " : "") + RST[l.status] }),
          l.status === "rejected" && l.decision_note ? h("small", { class: "pendsum", text: "เหตุผล: " + l.decision_note }) : null);
      }
      const sum = pendingSum[r.id] ? [...pendingSum[r.id]].join(", ") : "";

      return h("div", {},
        h("button", { type: "button", class: "badge pend", text: "รอพิจารณา " + n + " ›", title: "ขอแก้: " + sum,
          "aria-label": "พิจารณาคำขอแก้ไข " + n + " รายการ ของรายงาน " + r.occurred_on + " " + r.location, onclick: () => openReqDialog(r.id) }),
        sum ? h("small", { class: "pendsum", text: "ขอแก้: " + sum }) : null);

    // แสดงข้อความ: ถ้า popup เปิดอยู่ (modal บังหน้าเพจ) ให้แสดงใน popup
    function say(text, ok) {
      const d = document.getElementById("reqdlg");
      if (!d.open) { showMsg(text, ok); return; }
      d.querySelectorAll(".dlgmsg").forEach((e) => e.remove());
      const m = h("div", { class: "dlgmsg " + (ok ? "ok" : "error"), role: "alert", text });
      m.style.cssText = "padding:.5rem .8rem;margin:.5rem 0;border-left:4px solid " + (ok ? "#1b7a3d" : "#b3261e") + ";background:" + (ok ? "#e6f4ea" : "#fdeceb");
      d.querySelector("h3").after(m);
    }
    async function fetchState(id) {
      const inc = await sb.from("incident_reports").select("*, plants(code), incident_types(name_th)").eq("id", id).single();
      if (inc.error || !inc.data) { showMsg("เปิดรายงานไม่สำเร็จ: " + ((inc.error && inc.error.message) || ""), false); return false; }
      const [ps, lg, rq] = await Promise.all([
        sb.from("incident_persons").select("*").eq("incident_id", id).order("created_at"),
        sb.from("incident_edit_log").select("*").eq("incident_id", id).order("created_at", { ascending: false }),
        sb.from("incident_edit_requests").select("*").eq("incident_id", id).order("created_at", { ascending: false })
      ]);
      state.inc = inc.data; state.persons = ps.data || []; state.log = lg.data || []; state.reqs = rq.data || [];
      return true;
    }

    // ---------- แถบ Flow 4 ขั้นตอน (ผูกกับสถานะจริง flash / investigation / closed) ----------
    const STEPS = [
      { t: "ส่งรายงาน", who: "ผู้รายงาน" },
      { t: "SHE ตรวจสอบ", who: "SHE ของ Plant" },
      { t: "สอบสวน", who: "SHE (ระบบกำลังพัฒนา)" },
      { t: "ปิดเคส", who: "SHE ของ Plant" }
    ];
    const stageOf = (inc) => (inc.phase === "closed" ? 4 : inc.phase === "investigation" ? 2 : 1);
    const fmtDate = (v) => (v ? new Date(v).toLocaleDateString("en-GB") : "");
    function statusBadge(r) {
      if (r.deleted_at) return h("span", { class: "badge closed", text: "ถูกลบ" });
      const st = stageOf(r);
      return st === 4 ? h("span", { class: "badge done", text: "ปิดเคสแล้ว" })
        : st === 2 ? h("span", { class: "badge invest", text: "กำลังสอบสวน" })
        : h("span", { class: "badge review", text: "รอ SHE ตรวจสอบ" });
    }
    function stepper(inc) {
      const cur = stageOf(inc);
      const ol = h("ol", { class: "flow", "aria-label": "ขั้นตอนของรายงาน" });
      STEPS.forEach((s, i) => {
        const st = i < cur ? "done" : i === cur ? "current" : "todo";
        const extra = i === 0 ? fmtDate(inc.created_at) : (i === 3 && inc.closed_at ? fmtDate(inc.closed_at) : "");
        ol.append(h("li", { class: "step " + st, "aria-current": st === "current" ? "step" : false },
          h("span", { class: "dot", "aria-hidden": "true", text: st === "done" ? "✓" : String(i + 1) }),
          h("span", { class: "lbl" }, s.t, h("span", { class: "sr", text: st === "done" ? " (เสร็จแล้ว)" : st === "current" ? " (ขั้นตอนปัจจุบัน)" : " (ยังไม่ถึง)" })),
          h("small", { text: s.who }), extra ? h("small", { text: extra }) : null));
      });
      return ol;
    }
    function nextBox(inc, mgr, reporter) {
      const st = stageOf(inc);
      let now, next;
      if (inc.deleted_at) { now = "รายงานนี้ถูกลบแล้ว"; next = "ไม่ต้องดำเนินการใด ๆ"; }
      else if (st === 4) { now = "ปิดเคสแล้ว"; next = "ไม่ต้องทำอะไรเพิ่ม หากพบว่าข้อมูลผิด ต้องให้ Admin เปิดเคสใหม่ (Reopen) ก่อนจึงจะแก้ไขได้"; }
      else if (st === 2) { now = "SHE กำลังสอบสวน"; next = mgr ? "ขั้นต่อไป: สอบสวนให้เสร็จ แล้วกด \"ปิดเคส\" ด้านล่าง" : "ขั้นต่อไป: SHE จะสอบสวนและปิดเคส คุณไม่ต้องทำอะไรเพิ่ม"; }
      else if (mgr) { now = "รอคุณ (SHE) ตรวจสอบรายงานนี้"; next = "ขั้นต่อไป: ตรวจข้อมูล จัดประเภท (เช่น Recordable) พิจารณาคำขอแก้ไข (ถ้ามี) แล้วดำเนินการต่อจนปิดเคส"; }
      else { now = "รอ SHE ตรวจสอบรายงานของคุณ"; next = "ขั้นต่อไป: SHE จะตรวจสอบและจัดประเภทเหตุการณ์ คุณไม่ต้องทำอะไรเพิ่ม" + (reporter ? " (หากข้อมูลผิด กดปุ่ม \"ข้อมูลไม่ถูกต้อง? ขอแก้ไข\" ด้านล่าง)" : ""); }
      return h("div", { class: "nextbox", role: "status" }, h("div", { class: "now", text: "ตอนนี้: " + now }), h("div", { text: next }));
    }
    function groupOf(title, keys) {
      const dl = h("dl");
      keys.forEach((k) => dl.append(h("dt", { text: LBL[k] }), h("dd", { text: fmtVal(k, state.inc[k]) })));

    function renderDetail(box) {
      const inc = state.inc, closed = inc.phase === "closed", deleted = !!inc.deleted_at;
      const mgr = isMgrRole(), reporter = me && inc.reporter_id === me.id;
      box.replaceChildren();
      box.append(h("h3", { text: "รายงานเหตุการณ์ " + inc.occurred_on + " · " + (inc.plants ? inc.plants.code : "") }),
        stepper(inc), nextBox(inc, mgr, reporter));
      const pend = state.reqs.filter((q) => q.status === "pending");
      const lastDone = state.reqs.find((q) => q.status !== "pending" && q.status !== "cancelled");
      if (!pend.length && lastDone && reporter && lastDone.requested_by === me.id) {
        box.append(h("div", { class: "resultbox " + lastDone.status, role: "status" },
          lastDone.status === "rejected" ? "✕ คำขอแก้ไขล่าสุดของคุณ ไม่ได้รับอนุมัติ — ข้อมูลยังเป็นค่าเดิม" : "✓ คำขอแก้ไขล่าสุดของคุณ ได้รับอนุมัติแล้ว — ข้อมูลถูกแก้ไขแล้ว",
          lastDone.decision_note ? h("small", { text: "หมายเหตุจาก SHE: " + lastDone.decision_note }) : null));
      }
      if (pend.length) box.append(h("div", { class: "alertbox", role: "status", text:
        mgr ? "มีคำขอแก้ไข " + pend.length + " รายการรอคุณพิจารณา (ดูด้านล่าง)" : "คุณมีคำขอแก้ไขที่รอ SHE พิจารณาอยู่ ข้อมูลจะเปลี่ยนเมื่อ SHE อนุมัติ" }));

      // ข้อมูลปัจจุบัน แบ่งกลุ่มให้อ่านง่าย
      box.append(groupOf("เกิดอะไรขึ้น", ["occurred_on", "occurred_time", "location", "description", "incident_type_id", "department_text", "how_text", "why_text", "immediate_action"]));
      const pg = h("div", { class: "group" }, h("h4", { text: "ผู้เกี่ยวข้อง" }));
      if (!state.persons.length) pg.append(h("p", { text: "ไม่มีข้อมูลผู้เกี่ยวข้อง" }));
      state.persons.forEach((p, i) => pg.append(h("p", {}, h("strong", { text: "คนที่ " + (i + 1) + ": " }),
        fmtVal("role_in_case", p.role_in_case) + " | ชนิดการบาดเจ็บ: " + fmtVal("injury_type_code", p.injury_type_code) +
        " | ตำแหน่ง: " + fmtVal("body_part_codes", p.body_part_codes))));
      box.append(pg);
      const cls = ["high_hazard_code", "system_failure_code", "root_cause_code", "is_recordable", "is_serious_potential"];
      const cg = groupOf("การจัดประเภทโดย SHE", cls);
      if (cls.every((k) => inc[k] === null || inc[k] === undefined)) cg.append(h("small", { text: "SHE ยังไม่ได้จัดประเภท (ปกติจะทำในขั้น \"SHE ตรวจสอบ\")" }));
      box.append(cg);

      // คำขอแก้ไข
      if (state.reqs.length) {
        box.append(h("h4", { text: "คำขอแก้ไข" }));
        state.reqs.forEach((q) => box.append(reqBox(q, mgr)));
      }

      // แก้ไข / ขอแก้ไข
      if (deleted) { /* ไม่มีการแก้ไข */ }
      else if (closed) { if (isAdminRole()) box.append(reopenForm()); }
      else if (mgr || reporter) {
        const det = h("details", { class: "editdet" },
          h("summary", { text: mgr ? "แก้ไขข้อมูลรายงาน (ต้องระบุเหตุผล)" : "ข้อมูลไม่ถูกต้อง? ขอแก้ไขได้ที่นี่" }),
          h("div", {}, editForm(mgr)));
        if (pend.length && !mgr) det.open = false;
        box.append(det);
        if (mgr) box.append(closeForm());
      }

      // ประวัติ
      const ACT = { edit: "แก้ไขโดย SHE/Admin", approve_edit: "แก้ไขตามคำขอ (อนุมัติแล้ว)", close: "ปิดเคส (Close)", reopen: "เปิดเคสใหม่ (Reopen)" };
      const hist = h("div");
      if (!state.log.length) hist.append(h("p", { text: "ยังไม่มีประวัติการแก้ไข" }));
      state.log.forEach((l) => {
        const lines = describeChanges(l.changes || {});
        hist.append(h("div", { class: "logbox" }, h("strong", { text: ACT[l.action] || l.action }),
          h("small", { text: "  " + fmtTime(l.created_at) }), h("div", { text: "เหตุผล: " + l.reason }),
          lines.map((t) => h("div", { text: "• " + t }))));
      });
      box.append(h("details", { class: "histdet" }, h("summary", { text: "ประวัติการแก้ไข (" + state.log.length + ")" }), hist));
      box.append(h("div", { class: "rowbtns" }, h("button", { type: "button", class: "secondary small", text: "ปิดหน้านี้", onclick: () => { box.hidden = true; } })));
    }

    function reqBox(q, mgr) {
      const old = (scope, pid, k) => scope === "report" ? state.inc[k] : (state.persons.find((p) => p.id === pid) || {})[k];
      const ST = { pending: "รอดำเนินการ", approved: "อนุมัติแล้ว", rejected: "ไม่อนุมัติ", cancelled: "ยกเลิกแล้ว" };
      const mine = me && q.requested_by === me.id;
      const div = h("div", { class: "reqbox " + q.status },
        h("span", { class: "stchip " + q.status, text: (q.status === "rejected" ? "✕ " : q.status === "approved" ? "✓ " : "") + (ST[q.status] || q.status) }), h("small", { text: "  " + fmtTime(q.created_at) + (mine ? " · คำขอของคุณ" : "") }),
        h("div", { text: "เหตุผลที่ขอ: " + q.reason }),
        describeChanges(q.changes || {}, old).map((t) => h("div", { text: "• " + t })));
      if (q.decision_note) div.append(h("div", { class: "notebox", text: "หมายเหตุผู้พิจารณา: " + q.decision_note }));
      if (q.status === "pending") {
        const row = h("div", { class: "rowbtns" });
        if (mine) row.append(h("button", { type: "button", class: "small btn-danger-outline", text: "ยกเลิกคำขอ",
          onclick: () => act(sb.rpc("cancel_incident_edit", { req: q.id }), "ยกเลิกคำขอแล้ว") }));
        if (mgr && !mine) {
          const note = h("input", { type: "text", placeholder: "หมายเหตุ (จำเป็นเมื่อปฏิเสธ)", "aria-label": "หมายเหตุการพิจารณา", maxlength: "500" });
          row.append(
            h("button", { type: "button", class: "small btn-ok", text: "อนุมัติ (จะแก้ข้อมูลทันที)",
              onclick: () => act(sb.rpc("decide_incident_edit", { req: q.id, approve: true, note: note.value.trim() || null }), "อนุมัติและแก้ไขข้อมูลแล้ว") }),
            note,
            h("button", { type: "button", class: "small btn-danger-outline", text: "ไม่อนุมัติ",
              onclick: () => {
                if (note.value.trim().length < 3) { say("การไม่อนุมัติต้องระบุหมายเหตุ (อย่างน้อย 3 ตัวอักษร)", false); note.focus(); return; }
                act(sb.rpc("decide_incident_edit", { req: q.id, approve: false, note: note.value.trim() }), "บันทึกการไม่อนุมัติแล้ว");
              } }));
        }
        div.append(row);
      }
      return div;
    }

    function editForm(mgr) {
      const inc = state.inc;
      const wrap = h("div", { class: "editgrid" });
      wrap.append(h("p", {}, h("strong", { text: "วิธีใช้ (3 ขั้นตอน)" })),
        h("ol", { class: "steps123" },
          h("li", { text: "แก้เฉพาะช่องที่ต้องการเปลี่ยน (ช่องที่แก้จะมีกรอบสีน้ำเงิน)" }),
          h("li", { text: "ตรวจ \"สรุปสิ่งที่จะเปลี่ยน\" และพิมพ์เหตุผล" }),
          h("li", { text: mgr ? "กด \"บันทึกการแก้ไข\" ข้อมูลเปลี่ยนทันทีและมีประวัติเก็บไว้" : "กด \"ส่งคำขอแก้ไข\" ข้อมูลจะเปลี่ยนเมื่อ SHE อนุมัติ" })));
      const rf = REPORT_FIELDS.filter((f) => mgr || !f.mgr).map((f) => ({ f, i: makeInput(f, inc[f.k], "e-") }));
      rf.forEach(({ i }) => wrap.append(i.label, i.control, i.hint));
      const pf = state.persons.map((p, n) => {
        const box = h("div", { class: "personedit" }, h("strong", { text: "ผู้เกี่ยวข้องคนที่ " + (n + 1) }));
        const items = PERSON_FIELDS.map((f) => ({ f, i: makeInput(f, p[f.k], "p" + n + "-") }));
        items.forEach(({ i }) => box.append(i.label, i.control, i.hint));
        wrap.append(box); return { p, items };
      });

      const preview = h("div", { class: "previewbox", "aria-live": "polite" });
      const reason = h("textarea", { id: "e-reason", required: true, maxlength: "1000", "aria-describedby": "e-reason-help",
        placeholder: "เช่น ระบุตำแหน่งที่บาดเจ็บผิด ตรวจสอบกับใบรายงานแพทย์แล้ว" });

      // รวบรวมสิ่งที่เปลี่ยน (ใช้ทั้งแสดงตัวอย่างและตอนส่ง)
      function collect() {
        const changes = { report: {}, persons: {} }; let missing = null;
        rf.forEach(({ f, i }) => {
          const v = i.get(); const ch = !same(f.k, inc[f.k], v);
          i.control.classList.toggle("changed", ch);
          if (f.req && v === null) { missing = missing || { f, i }; }
          if (ch) changes.report[f.k] = v;
        });
        pf.forEach(({ p, items }) => {
          const d = {};
          items.forEach(({ f, i }) => { const v = i.get(); const ch = !same(f.k, p[f.k], v); i.control.classList.toggle("changed", ch); if (ch) d[f.k] = v; });
          if (Object.keys(d).length) changes.persons[p.id] = d;
        });
        return { changes, missing, count: Object.keys(changes.report).length + Object.keys(changes.persons).length };
      }
      function refresh() {
        const { changes, count } = collect();
        preview.replaceChildren(h("div", { class: "t", text: "สรุปสิ่งที่จะเปลี่ยน" }));
        if (!count) { preview.append(h("div", { text: "ยังไม่มีการเปลี่ยนแปลง (ลองแก้ช่องด้านบน)" })); return; }
        const old = (scope, pid, k) => scope === "report" ? inc[k] : (state.persons.find((p) => p.id === pid) || {})[k];
        describeChanges(changes, old).forEach((t) => preview.append(h("div", { text: "• " + t })));
      }
      wrap.addEventListener("input", refresh); wrap.addEventListener("change", refresh);

      wrap.append(preview, h("label", { for: "e-reason", text: "เหตุผลที่แก้ไข * (อย่างน้อย 10 ตัวอักษร)" }), reason,
        h("small", { class: "hint", id: "e-reason-help", text: "บอกสั้น ๆ ว่าทำไมต้องแก้ เพื่อให้ผู้ตรวจสอบเข้าใจ" }));

      const btn = h("button", { type: "button", class: "btn-ok", text: mgr ? "บันทึกการแก้ไข" : "ส่งคำขอแก้ไข" });
      btn.addEventListener("click", () => {
        const { changes, missing, count } = collect();
        if (missing) { showMsg("ช่อง \"" + LBL[missing.f.k] + "\" ห้ามเว้นว่าง", false); missing.i.control.focus(); return; }
        if (!count) { showMsg("ยังไม่มีการเปลี่ยนแปลงจากค่าเดิม", false); return; }
        const rs = reason.value.trim();
        if (rs.length < 10) { showMsg("กรุณาระบุเหตุผลอย่างน้อย 10 ตัวอักษร", false); reason.focus(); return; }
        if (mgr) act(sb.rpc("edit_incident", { inc: inc.id, changes, reason: rs }), "บันทึกการแก้ไขเรียบร้อย");
        else act(sb.rpc("request_incident_edit", { inc: inc.id, changes, reason: rs }), "ส่งคำขอแก้ไขเรียบร้อย รอ SHE/Admin พิจารณา");
      });
      wrap.append(h("div", { class: "rowbtns" }, btn));
      refresh();
      return wrap;
    }

    function closeForm() {
      const r = h("input", { type: "text", placeholder: "หมายเหตุการปิด (ไม่บังคับ)", maxlength: "500", "aria-label": "หมายเหตุการปิด" });
      return h("div", {}, h("h4", { text: "ปิดเคส (Close)" }),
        h("p", { text: "กดเมื่อตรวจสอบและจัดประเภทครบแล้ว เมื่อปิดเคสแล้วจะแก้ไขไม่ได้ ต้องให้ Admin เปิดใหม่ (Reopen) พร้อมเหตุผล" }),
        h("div", { class: "rowbtns" }, r, h("button", { type: "button", class: "btn-danger-outline", text: "ปิดเคส (Close)",
          onclick: () => act(sb.rpc("close_incident", { inc: state.inc.id, reason: r.value.trim() || null }), "ปิดรายงานแล้ว") })));
    }

    function reopenForm() {
      const r = h("input", { type: "text", placeholder: "เหตุผลที่เปิดใหม่ (อย่างน้อย 10 ตัวอักษร)", maxlength: "500", "aria-label": "เหตุผลที่เปิดใหม่" });
      return h("div", { class: "rowbtns" }, r, h("button", { type: "button", class: "btn-ok", text: "เปิดรายงานใหม่ (Reopen)",
        onclick: () => act(sb.rpc("reopen_incident", { inc: state.inc.id, reason: r.value.trim() }), "เปิดรายงานใหม่แล้ว") }));
    }

    // เรียก RPC -> แจ้งผล -> โหลดตารางและแผงใหม่ (สิทธิ์จริงตัดสินที่ฐานข้อมูล ไม่ใช่หน้านี้)
    async function act(promise, okText) {
      const sel = "#detail button, #reqdlg button";
      document.querySelectorAll(sel).forEach((b) => { b.disabled = true; });
      const { error } = await promise;
      if (error) { say(errTh(error), false); document.querySelectorAll(sel).forEach((b) => { b.disabled = false; }); return; }
      showMsg(okText, true);
      await loadIncidents();
      if (dlgInc) {            // ทำจาก popup ในหน้ารายการ: โหลดใหม่ ถ้าไม่มีคำขอค้างแล้วให้ปิด popup
        const id = dlgInc;
        if (await fetchState(id)) {
          if (state.reqs.some((q) => q.status === "pending")) { renderReqDialog(); say(okText, true); } else closeReqDialog();
        }
        if (detailId === id && !document.getElementById("detail").hidden) { await openDetail(id); }
        return;
      }
      await openDetail(state.inc.id);
    }

    (async () => {
      me = await getMyProfile();
      await loadMasters();
      const pl = await sb.from("plants").select("id, code").order("code");
      PLANTS = pl.data || [];
      buildFilterBar();
      await loadIncidents();
    })();

    load("checklist_inspections", "inspected_on",
      "inspected_on, area, items, note, created_at",
      "t-checklist", ["วันที่", "พื้นที่", "ผ่าน", "หมายเหตุ", "บันทึกเมื่อ"],
      (r) => {
        const v = Object.values(r.items || {});
        return [r.inspected_on, r.area, v.filter(Boolean).length + "/" + v.length, r.note, fmtTime(r.created_at)];
      });

    load("training_records", "trained_on",
      "trained_on, course, hours, attendees, created_at",
      "t-training", ["วันที่", "หลักสูตร", "ชั่วโมง", "ผู้เข้าอบรม", "บันทึกเมื่อ"],
      (r) => [r.trained_on, r.course, r.hours, r.attendees, fmtTime(r.created_at)]);
  </script>
</body>
</html>
