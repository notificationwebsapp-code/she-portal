<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="style.css">
  <title>ดูข้อมูล | SHE Portal</title>
  <style>
    /* ส่วนจัดการรายงาน (ขอแก้ไข / แก้ไขพร้อมเหตุผล / ประวัติ) */
    #detail{border:1px solid var(--line);border-radius:8px;padding:1rem;margin:0 0 1.5rem;background:#fff}
    #detail h4{margin:1.2rem 0 .4rem}
    #detail dl{display:grid;grid-template-columns:minmax(9rem,14rem) 1fr;gap:.25rem .8rem;margin:0}
    #detail dt{font-weight:600}
    #detail dd{margin:0;overflow-wrap:anywhere}
    .editgrid label{display:block;margin:.6rem 0 .15rem;font-weight:600}
    .editgrid input[type=text],.editgrid input[type=date],.editgrid input[type=time],.editgrid select,.editgrid textarea{width:100%}
    .editgrid input[type=time]{padding:.6rem .75rem;margin-top:.3rem;border:1px solid #9aa6bb;border-radius:8px;font:inherit;background:#fff;color:inherit}
    .editgrid textarea{min-height:4.5rem}
    .changed{outline:2px solid var(--brand);outline-offset:1px}
    .editgrid label.chk{display:inline-flex;align-items:center;gap:.3rem;margin:.2rem .8rem .2rem 0;font-weight:400}
    .personedit{border:1px dashed var(--line);border-radius:8px;padding:.6rem .8rem;margin:.6rem 0}
    .reqbox,.logbox{border-left:4px solid var(--line);padding:.4rem .8rem;margin:.5rem 0}
    .reqbox.pending{border-left-color:var(--brand)}
    .logbox small,.reqbox small{color:#555}
    .rowbtns{display:flex;flex-wrap:wrap;gap:.5rem;margin-top:.6rem;align-items:center}
    .badge{display:inline-block;padding:.12rem .65rem;border-radius:999px;border:1px solid var(--line);font-size:.85rem;font-weight:600}
    .badge.closed{background:#eee}.badge.pend{background:#fff4d6;border-color:#e0b43a;color:#6b4200}
    .badge.review{background:#e8f0ff;border-color:#9db8ea;color:#082c69}.badge.invest{background:#fff4d6;border-color:#e0b43a;color:#6b4200}
    .badge.done{background:#e6f4ea;border-color:#8cc5a0;color:#14532d}
    .sr{position:absolute;left:-9999px}
    #t-incident td button{white-space:nowrap}
    /* แถบ Flow 4 ขั้นตอน */
    ol.flow{display:flex;list-style:none;padding:0;margin:.6rem 0 1rem}
    ol.flow li.step{flex:1;position:relative;display:flex;flex-direction:column;align-items:center;text-align:center;gap:.1rem;padding:0 .25rem}
    ol.flow li.step::before{content:"";position:absolute;top:17px;right:50%;width:100%;height:4px;background:var(--line);z-index:0}
    ol.flow li.step:first-child::before{display:none}
    ol.flow li.step.done::before,ol.flow li.step.current::before{background:var(--ok)}
    ol.flow .dot{position:relative;z-index:1;width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;background:#fff;border:3px solid #9aa6bb;color:var(--muted)}
    ol.flow .done .dot{background:var(--ok);border-color:var(--ok);color:#fff}
    ol.flow .current .dot{background:var(--brand);border-color:var(--brand);color:#fff;box-shadow:0 0 0 5px var(--accent)}
    ol.flow .lbl{font-weight:700}
    ol.flow .todo .lbl{color:var(--muted);font-weight:600}
    ol.flow small{color:var(--muted);font-size:.82rem}
    @media (max-width:640px){
      ol.flow{flex-direction:column;gap:.2rem}
      ol.flow li.step{flex-direction:row;align-items:center;text-align:left;gap:.2rem .7rem;padding:.3rem 0;flex-wrap:wrap}
      ol.flow li.step::before{display:none}
    }
    @media (max-width:640px){#detail dl{grid-template-columns:1fr}#detail dt{margin-top:.5rem;color:var(--muted);font-size:.9rem}}
    .nextbox{background:var(--accent);border-left:5px solid var(--brand);border-radius:8px;padding:.7rem 1rem;margin:0 0 1rem}
    .nextbox .now{font-size:1.1rem;font-weight:700;color:var(--brand)}
    .nextbox div{margin-top:.2rem}
    .alertbox{background:#fff4d6;border-left:5px solid #e0b43a;border-radius:8px;padding:.6rem 1rem;margin:0 0 1rem}
    .group{border:1px solid var(--line);border-radius:10px;padding:.2rem 1rem .9rem;margin:.8rem 0}
    .group h4{margin:.7rem 0 .4rem;color:var(--brand)}
    .editgrid small.hint{display:block;color:var(--muted);font-size:.88rem;margin:.15rem 0 0}
    details.editdet,details.histdet{border:1px solid var(--line);border-radius:10px;margin:1rem 0;background:#fafbfe}
    details.editdet>summary,details.histdet>summary{cursor:pointer;padding:.8rem 1rem;font-weight:700;color:var(--brand);list-style:none;min-height:44px;display:flex;align-items:center}
    details.editdet>summary::before,details.histdet>summary::before{content:"▸";margin-right:.6rem;transition:transform .15s}
    details[open]>summary::before{transform:rotate(90deg)}
    details.editdet>div,details.histdet>div{padding:0 1rem 1rem}
    .steps123{margin:.2rem 0 .6rem;padding-left:1.3rem}
    .previewbox{background:#fff;border:2px dashed var(--brand);border-radius:8px;padding:.5rem .9rem;margin:1rem 0}
    .previewbox .t{font-weight:700;color:var(--brand)}
  </style>
</head>
<body>
  <header>
    <h1>SHE Portal</h1>
    <nav>
      <a href="index.html">หน้าแรก</a>
      <a href="incident.html">รายงานอุบัติเหตุ</a>
      <a href="checklist.html">เช็กลิสต์ตรวจ</a>
      <a href="training.html">บันทึกการอบรม</a>
      <a href="records.html">ดูข้อมูล</a>
      <a href="login.html">เข้าสู่ระบบ</a>
    </nav>
  </header>

  <main>
    <h2>ดูข้อมูลที่บันทึกแล้ว</h2>
    <p id="msg" role="status" class="msg" hidden></p>
    <p><small>ระบบแสดงเฉพาะข้อมูลที่คุณมีสิทธิ์ดู พนักงานทั่วไปเห็นเฉพาะรายงานของตัวเอง</small></p>

    <h3>รายงานอุบัติเหตุ</h3>
    <div class="tablewrap"><table id="t-incident"></table></div>
    <section id="detail" aria-live="polite" hidden></section>

    <h3>เช็กลิสต์ตรวจ</h3>
    <div class="tablewrap"><table id="t-checklist"></table></div>

    <h3>บันทึกการอบรม</h3>
    <div class="tablewrap"><table id="t-training"></table></div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script src="config.js"></script>
  <script src="auth.js"></script>
  <script>
    requireLogin();
    const msg = document.getElementById("msg");
    function showMsg(text, ok) {
      msg.textContent = text; msg.className = "msg " + (ok ? "ok" : "error"); msg.hidden = false;
      msg.scrollIntoView({ block: "nearest" });
    }

    // สร้าง element ด้วย createElement + textContent (ไม่ใช้ innerHTML) กัน XSS (OWASP A03)
    function h(tag, attrs, ...kids) {
      const e = document.createElement(tag);
      Object.entries(attrs || {}).forEach(([k, v]) => {
        if (v === false || v == null) return;
        if (k === "text") e.textContent = v;
        else if (k === "class") e.className = v;
        else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
        else e.setAttribute(k, v === true ? "" : v);
      });
      kids.flat().forEach((c) => { if (c != null) e.append(c.nodeType ? c : document.createTextNode(String(c))); });
      return e;
    }

    function render(tableId, headers, rows) {
      const table = document.getElementById(tableId);
      table.replaceChildren();
      const thead = table.createTHead().insertRow();
      headers.forEach((t) => { const th = document.createElement("th"); th.textContent = t; thead.appendChild(th); });
      const tbody = table.createTBody();
      if (rows.length === 0) {
        const td = tbody.insertRow().insertCell();
        td.colSpan = headers.length;
        td.textContent = "ยังไม่มีข้อมูลที่คุณมีสิทธิ์เห็น";
        return;
      }
      rows.forEach((r) => {
        const tr = tbody.insertRow();
        r.forEach((v) => { const td = tr.insertCell(); if (v && v.nodeType) td.appendChild(v); else td.textContent = v ?? ""; });
      });
    }

    // แสดงเวลาที่บันทึก (DB เก็บเป็น UTC) ตามเขตเวลาของอุปกรณ์ผู้ใช้ (รองรับหลายประเทศ ไม่ฝังเวลาไทย)
    function fmtTime(v) {
      if (!v) return "";
      return new Date(v).toLocaleString("en-GB", { hour12: false, year: "numeric", month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit" });
    }

    async function load(table, order, cols, tableId, headers, toRow) {
      const { data, error } = await sb.from(table).select(cols)
        .order(order, { ascending: false }).order("created_at", { ascending: false }).limit(50);
      if (error) { showMsg("โหลดข้อมูลไม่สำเร็จ: " + error.message, false); return; }
      render(tableId, headers, data.map(toRow));
    }

    // ---------- รายการตัวเลือก (Master list) ----------
    let LK = {}, TYPES = [];
    async function loadMasters() {
      const a = await sb.from("lookup_values").select("kind, code, name_th, sort_order")
        .eq("active", true).order("sort_order").order("code");
      LK = {};
      (a.data || []).forEach((r) => { (LK[r.kind] = LK[r.kind] || []).push(r); });
      const t = await sb.from("incident_types").select("id, code, name_th").eq("active", true).order("sort_order");
      TYPES = t.data || [];
    }
    const lkName = (kind, code) => { const f = (LK[kind] || []).find((x) => x.code === code); return f ? f.name_th : code; };
    const typeName = (id) => { const f = TYPES.find((x) => x.id === id); return f ? f.name_th : id; };

    // ---------- นิยามฟิลด์ที่แก้ได้ (ต้องตรงกับ whitelist ใน incident_editable_fields ของฐานข้อมูล) ----------
    const LBL = {
      occurred_on: "วันที่เกิดเหตุ", occurred_time: "เวลาเกิดเหตุ", location: "จุดเกิดเหตุ", description: "เกิดอะไรขึ้น",
      incident_type_id: "ประเภทเหตุการณ์", department_text: "แผนก", how_text: "เกิดขึ้นอย่างไร (How)",
      why_text: "ทำไมจึงเกิด (Why)", immediate_action: "การดำเนินการทันที", high_hazard_code: "High hazard",
      system_failure_code: "System / Program failure", root_cause_code: "Root cause", is_recordable: "Recordable",
      is_serious_potential: "Serious / Potentially serious", role_in_case: "บทบาท", injury_type_code: "ชนิดการบาดเจ็บ",
      body_part_codes: "ตำแหน่งที่บาดเจ็บ", phase: "สถานะ"
    };
    const ROLE_TH = { injured: "ผู้บาดเจ็บ", witness: "พยาน", other: "อื่น ๆ" };
    // mgr = เฉพาะ SHE/Admin ของ Plant (ตรงกับ incident_classify_guard) ; req = จำเป็นต้องมีค่า (คอลัมน์ NOT NULL)
    const REPORT_FIELDS = [
      { k: "occurred_on", t: "date", req: true }, { k: "occurred_time", t: "time" },
      { k: "location", t: "text", req: true }, { k: "description", t: "area", req: true },
      { k: "incident_type_id", t: "type", req: true }, { k: "department_text", t: "text" },
      { k: "how_text", t: "area" }, { k: "why_text", t: "area" }, { k: "immediate_action", t: "area" },
      { k: "high_hazard_code", t: "lk", kind: "high_hazard" },
      { k: "system_failure_code", t: "lk", kind: "system_failure", mgr: true },
      { k: "root_cause_code", t: "lk", kind: "root_cause", mgr: true },
      { k: "is_recordable", t: "bool", mgr: true }, { k: "is_serious_potential", t: "bool", mgr: true }
    ];
    const PERSON_FIELDS = [
      { k: "role_in_case", t: "role", req: true }, { k: "injury_type_code", t: "lk", kind: "injury_type" },
      { k: "body_part_codes", t: "multi", kind: "body_part" }
    ];

    // คำอธิบายใต้ช่อง (ภาษาง่าย) สำหรับผู้ใช้ที่ไม่คุ้นเคย
    const HINT = {
      occurred_on: "วันที่เกิดเหตุจริง (ไม่ใช่วันที่กรอกข้อมูล)",
      occurred_time: "เวลาที่เกิดเหตุ ถ้าไม่แน่ใจให้ใส่เวลาโดยประมาณ",
      location: "เช่น ไลน์ผลิต 2, โกดังสินค้า, ลานจอดรถ",
      description: "เล่าสั้น ๆ ว่าเกิดอะไรขึ้น กับใคร ที่ไหน",
      incident_type_id: "เลือกประเภทที่ใกล้เคียงที่สุด SHE จะตรวจสอบอีกครั้ง",
      department_text: "แผนกที่เกี่ยวข้องกับเหตุการณ์",
      how_text: "ลำดับเหตุการณ์ว่าเกิดขึ้นได้อย่างไร",
      why_text: "คุณคิดว่าเกิดจากอะไร (ถ้าทราบ)",
      immediate_action: "สิ่งที่ทำทันทีหลังเกิดเหตุ เช่น ปฐมพยาบาล หยุดเครื่องจักร",
      high_hazard_code: "ถ้าเกี่ยวกับงานเสี่ยงสูง (High hazard) ให้เลือก ถ้าไม่เกี่ยวให้เว้นไว้",
      system_failure_code: "ระบบหรือโปรแกรมความปลอดภัยที่ขาดหายหรือใช้ไม่ได้ผล (SHE เป็นผู้ระบุ)",
      root_cause_code: "สาเหตุที่แท้จริงหลังตรวจสอบ (SHE เป็นผู้ระบุ)",
      is_recordable: "เหตุที่ต้องบันทึกตามเกณฑ์ของกฎหมาย/มาตรฐานที่ Plant ใช้ (เช่น OSHA 29 CFR 1904) SHE เป็นผู้ตัดสิน",
      is_serious_potential: "เหตุร้ายแรง หรืออาจร้ายแรงได้ถ้าเกิดซ้ำ (SHE เป็นผู้ตัดสิน)",
      role_in_case: "ผู้บาดเจ็บ = ได้รับบาดเจ็บ, พยาน = เห็นเหตุการณ์",
      injury_type_code: "ลักษณะการบาดเจ็บ เช่น บาดแผล กระดูกหัก",
      body_part_codes: "ติ๊กได้หลายตำแหน่ง"
    };

    function fmtVal(k, v) {
      if (v === null || v === undefined || v === "" || (Array.isArray(v) && !v.length)) return "—";
      if (typeof v === "boolean") return v ? "ใช่" : "ไม่ใช่";
      if (k === "incident_type_id") return typeName(v);
      if (k === "occurred_time") return String(v).slice(0, 5);
      if (k === "role_in_case") return ROLE_TH[v] || v;
      if (k === "phase") return v === "closed" ? "Closed" : "Open";
      if (k === "body_part_codes") return v.map((c) => lkName("body_part", c)).join(", ");
      const f = REPORT_FIELDS.concat(PERSON_FIELDS).find((x) => x.k === k);
      if (f && f.t === "lk") return lkName(f.kind, v);
      return String(v);
    }
    const norm = (k, v) => {
      if (Array.isArray(v)) return v.length ? JSON.stringify([...v].sort()) : null;
      if (k === "occurred_time" && v) return String(v).slice(0, 5);
      if (v === "" || v === undefined) return null;
      return v;
    };
    const same = (k, a, b) => norm(k, a) === norm(k, b);

    // ---------- สร้างช่องกรอกของแต่ละฟิลด์ ----------
    function makeInput(f, cur, idPrefix) {
      const id = idPrefix + f.k;
      let control, get;
      const opts = (list, curVal) => {
        const s = h("select", { id }); s.append(h("option", { value: "", text: "— ไม่ระบุ —" }));
        list.forEach((o) => s.append(h("option", { value: o.code, text: o.name_th })));
        if (curVal && !list.some((o) => o.code === curVal)) s.append(h("option", { value: curVal, text: curVal + " (ไม่ active)" }));
        s.value = curVal || ""; return s;
      };
      if (f.t === "date" || f.t === "time" || f.t === "text") {
        control = h("input", { id, type: f.t });
        control.value = f.t === "time" ? (cur ? String(cur).slice(0, 5) : "") : (cur ?? "");
        get = () => (control.value.trim() === "" ? null : control.value.trim());
      } else if (f.t === "area") {
        control = h("textarea", { id }); control.value = cur ?? "";
        get = () => (control.value.trim() === "" ? null : control.value.trim());
      } else if (f.t === "type") {
        control = h("select", { id });
        TYPES.forEach((o) => control.append(h("option", { value: o.id, text: o.name_th })));
        if (cur && !TYPES.some((o) => o.id === cur)) control.append(h("option", { value: cur, text: "(ประเภทที่ปิดใช้งาน)" }));
        control.value = cur || ""; get = () => control.value || null;
      } else if (f.t === "lk") {
        control = opts(LK[f.kind] || [], cur); get = () => control.value || null;
      } else if (f.t === "role") {
        control = h("select", { id });
        Object.entries(ROLE_TH).forEach(([v, t]) => control.append(h("option", { value: v, text: t })));
        control.value = cur || "injured"; get = () => control.value;
      } else if (f.t === "bool") {
        control = h("select", { id });
        [["", "— ไม่ระบุ —"], ["true", "ใช่"], ["false", "ไม่ใช่"]].forEach(([v, t]) => control.append(h("option", { value: v, text: t })));
        control.value = cur === true ? "true" : cur === false ? "false" : "";
        get = () => (control.value === "" ? null : control.value === "true");
      } else if (f.t === "multi") {
        const list = LK[f.kind] || []; const have = new Set(cur || []);
        control = h("div", { id, role: "group" });
        const boxes = [];
        const all = list.concat([...have].filter((c) => !list.some((o) => o.code === c)).map((c) => ({ code: c, name_th: c + " (ไม่ active)" })));
        all.forEach((o) => {
          const cb = h("input", { type: "checkbox", value: o.code }); cb.checked = have.has(o.code); boxes.push(cb);
          control.append(h("label", { class: "chk" }, cb, o.name_th));
        });
        get = () => { const v = boxes.filter((b) => b.checked).map((b) => b.value); return v.length ? v : null; };
      }
      const hint = HINT[f.k] ? h("small", { class: "hint", id: id + "-h", text: HINT[f.k] }) : null;
      if (hint) control.setAttribute("aria-describedby", id + "-h");
      return { control, get, hint, label: h("label", { for: id, text: LBL[f.k] + (f.req ? " *" : "") }) };
    }

    // ---------- สรุปการเปลี่ยนแปลง ----------
    function describeChanges(changes, mapOld) {
      // changes: {report:{k:v | {old,new}}, persons:{id:{k:...}}}; mapOld(scope,id,k) คืนค่าเดิมกรณีเป็นคำขอ (ยังไม่มี old)
      const out = [];
      const line = (label, k, v, scope, pid) => {
        const isDiff = v && typeof v === "object" && !Array.isArray(v) && ("old" in v || "new" in v);
        const nw = isDiff ? v.new : v;
        const old = isDiff ? v.old : (mapOld ? mapOld(scope, pid, k) : undefined);
        out.push(label + ": " + (old === undefined ? "" : fmtVal(k, old) + " → ") + fmtVal(k, nw));
      };
      Object.entries(changes.report || {}).forEach(([k, v]) => line(LBL[k] || k, k, v, "report"));
      Object.entries(changes.persons || {}).forEach(([pid, fs]) => {
        const n = (state.persons.findIndex((p) => p.id === pid) + 1) || "?";
        Object.entries(fs).forEach(([k, v]) => line("ผู้เกี่ยวข้อง #" + n + " · " + (LBL[k] || k), k, v, "person", pid));
      });
      return out;
    }

    // แปลข้อความ error ของ RPC เป็นภาษาไทย (ข้อความจริงมาจากฐานข้อมูล; สิทธิ์จริงบังคับที่ฐานข้อมูลเสมอ)
    function errTh(e) {
      const m = (e && e.message) || "";
      const map = [
        [/Reason must be/i, "เหตุผลต้องมีอย่างน้อย 10 ตัวอักษร"], [/note is required/i, "การปฏิเสธต้องระบุหมายเหตุ"],
        [/closed/i, "รายงานถูกปิดแล้ว ต้องให้ Admin เปิดใหม่ (Reopen) ก่อนจึงจะแก้ได้"], [/No changes/i, "ไม่มีการเปลี่ยนแปลงจากค่าเดิม"],
        [/Cannot decide your own/i, "ไม่สามารถอนุมัติ/ปฏิเสธคำขอของตัวเองได้"], [/duplicate key/i, "คุณมีคำขอที่รอดำเนินการของรายงานนี้อยู่แล้ว"],
        [/Only the reporter/i, "เฉพาะผู้รายงานเท่านั้นที่ขอแก้ไขได้"], [/Only SHE|Only Admin|permission|42501/i, "คุณไม่มีสิทธิ์ทำรายการนี้"],
        [/Invalid .*code|check constraint|violates/i, "ข้อมูลไม่ถูกต้องตามกติกาของระบบ: " + m],
        [/not editable/i, "ฟิลด์นี้ไม่อนุญาตให้แก้ไข"], [/is deleted/i, "รายงานนี้ถูกลบแล้ว"]
      ];
      const hit = map.find(([re]) => re.test(m));
      return hit ? hit[1] : "ดำเนินการไม่สำเร็จ: " + m;
    }

    // ---------- รายงานอุบัติเหตุ: ตาราง + แผงรายละเอียด ----------
    let me = null, pendingCount = {};
    const state = { inc: null, persons: [], log: [], reqs: [] };
    const isMgrRole = () => me && me.status === "active" && ["she", "admin", "super_admin"].includes(me.role);
    const isAdminRole = () => me && me.status === "active" && ["admin", "super_admin"].includes(me.role);

    async function loadIncidents() {
      const { data, error } = await sb.from("incident_reports")
        .select("id, reporter_id, phase, deleted_at, occurred_on, occurred_time, location, type, description, created_at, plants(code), incident_types(name_th)")
        .order("occurred_on", { ascending: false }).order("created_at", { ascending: false }).limit(50);
      if (error) { showMsg("โหลดข้อมูลไม่สำเร็จ: " + error.message, false); return; }
      const rq = await sb.from("incident_edit_requests").select("incident_id").eq("status", "pending");
      pendingCount = {};
      (rq.data || []).forEach((r) => { pendingCount[r.incident_id] = (pendingCount[r.incident_id] || 0) + 1; });
      render("t-incident",
        ["วันที่-เวลาเกิดเหตุ", "Plant", "ประเภท", "จุดเกิดเหตุ", "เกิดอะไรขึ้น", "ตอนนี้อยู่ขั้นตอน", "คำขอแก้ไข", "ส่งเมื่อ", ""],
        data.map((r) => [
          r.occurred_on + (r.occurred_time ? " " + r.occurred_time.slice(0, 5) : ""),
          r.plants ? r.plants.code : "",
          r.incident_types ? r.incident_types.name_th : r.type,
          r.location, r.description,
          statusBadge(r),
          pendingCount[r.id] ? h("span", { class: "badge pend", text: "รอพิจารณา " + pendingCount[r.id] }) : "",
          fmtTime(r.created_at),
          h("button", { type: "button", class: "small", text: "เปิดดู", "aria-label": "เปิดดูรายงาน " + r.occurred_on + " " + r.location, onclick: () => openDetail(r.id) })
        ]));
    }

    async function openDetail(id) {
      const box = document.getElementById("detail");
      const inc = await sb.from("incident_reports")
        .select("*, plants(code), incident_types(name_th)").eq("id", id).single();
      if (inc.error || !inc.data) { showMsg("เปิดรายงานไม่สำเร็จ: " + ((inc.error && inc.error.message) || ""), false); return; }
      const [ps, lg, rq] = await Promise.all([
        sb.from("incident_persons").select("*").eq("incident_id", id).order("created_at"),
        sb.from("incident_edit_log").select("*").eq("incident_id", id).order("created_at", { ascending: false }),
        sb.from("incident_edit_requests").select("*").eq("incident_id", id).order("created_at", { ascending: false })
      ]);
      state.inc = inc.data; state.persons = ps.data || []; state.log = lg.data || []; state.reqs = rq.data || [];
      renderDetail(box);
      box.hidden = false; box.scrollIntoView({ block: "start" });
    }

    // ---------- แถบ Flow 4 ขั้นตอน (ผูกกับสถานะจริง flash / investigation / closed) ----------
    const STEPS = [
      { t: "ส่งรายงาน", who: "ผู้รายงาน" },
      { t: "SHE ตรวจสอบ", who: "SHE ของ Plant" },
      { t: "สอบสวน", who: "SHE (ระบบกำลังพัฒนา)" },
      { t: "ปิดเคส", who: "SHE ของ Plant" }
    ];
    const stageOf = (inc) => (inc.phase === "closed" ? 4 : inc.phase === "investigation" ? 2 : 1);
    const fmtDate = (v) => (v ? new Date(v).toLocaleDateString("en-GB") : "");
    function statusBadge(r) {
      if (r.deleted_at) return h("span", { class: "badge closed", text: "ถูกลบ" });
      const st = stageOf(r);
      return st === 4 ? h("span", { class: "badge done", text: "ปิดเคสแล้ว" })
        : st === 2 ? h("span", { class: "badge invest", text: "กำลังสอบสวน" })
        : h("span", { class: "badge review", text: "รอ SHE ตรวจสอบ" });
    }
    function stepper(inc) {
      const cur = stageOf(inc);
      const ol = h("ol", { class: "flow", "aria-label": "ขั้นตอนของรายงาน" });
      STEPS.forEach((s, i) => {
        const st = i < cur ? "done" : i === cur ? "current" : "todo";
        const extra = i === 0 ? fmtDate(inc.created_at) : (i === 3 && inc.closed_at ? fmtDate(inc.closed_at) : "");
        ol.append(h("li", { class: "step " + st, "aria-current": st === "current" ? "step" : false },
          h("span", { class: "dot", "aria-hidden": "true", text: st === "done" ? "✓" : String(i + 1) }),
          h("span", { class: "lbl" }, s.t, h("span", { class: "sr", text: st === "done" ? " (เสร็จแล้ว)" : st === "current" ? " (ขั้นตอนปัจจุบัน)" : " (ยังไม่ถึง)" })),
          h("small", { text: s.who }), extra ? h("small", { text: extra }) : null));
      });
      return ol;
    }
    function nextBox(inc, mgr, reporter) {
      const st = stageOf(inc);
      let now, next;
      if (inc.deleted_at) { now = "รายงานนี้ถูกลบแล้ว"; next = "ไม่ต้องดำเนินการใด ๆ"; }
      else if (st === 4) { now = "ปิดเคสแล้ว"; next = "ไม่ต้องทำอะไรเพิ่ม หากพบว่าข้อมูลผิด ต้องให้ Admin เปิดเคสใหม่ (Reopen) ก่อนจึงจะแก้ไขได้"; }
      else if (st === 2) { now = "SHE กำลังสอบสวน"; next = mgr ? "ขั้นต่อไป: สอบสวนให้เสร็จ แล้วกด \"ปิดเคส\" ด้านล่าง" : "ขั้นต่อไป: SHE จะสอบสวนและปิดเคส คุณไม่ต้องทำอะไรเพิ่ม"; }
      else if (mgr) { now = "รอคุณ (SHE) ตรวจสอบรายงานนี้"; next = "ขั้นต่อไป: ตรวจข้อมูล จัดประเภท (เช่น Recordable) พิจารณาคำขอแก้ไข (ถ้ามี) แล้วดำเนินการต่อจนปิดเคส"; }
      else { now = "รอ SHE ตรวจสอบรายงานของคุณ"; next = "ขั้นต่อไป: SHE จะตรวจสอบและจัดประเภทเหตุการณ์ คุณไม่ต้องทำอะไรเพิ่ม" + (reporter ? " (หากข้อมูลผิด กดปุ่ม \"ข้อมูลไม่ถูกต้อง? ขอแก้ไข\" ด้านล่าง)" : ""); }
      return h("div", { class: "nextbox", role: "status" }, h("div", { class: "now", text: "ตอนนี้: " + now }), h("div", { text: next }));
    }
    function groupOf(title, keys) {
      const dl = h("dl");
      keys.forEach((k) => dl.append(h("dt", { text: LBL[k] }), h("dd", { text: fmtVal(k, state.inc[k]) })));
      return h("div", { class: "group" }, h("h4", { text: title }), dl);
    }

    function renderDetail(box) {
      const inc = state.inc, closed = inc.phase === "closed", deleted = !!inc.deleted_at;
      const mgr = isMgrRole(), reporter = me && inc.reporter_id === me.id;
      box.replaceChildren();
      box.append(h("h3", { text: "รายงานเหตุการณ์ " + inc.occurred_on + " · " + (inc.plants ? inc.plants.code : "") }),
        stepper(inc), nextBox(inc, mgr, reporter));
      const pend = state.reqs.filter((q) => q.status === "pending");
      if (pend.length) box.append(h("div", { class: "alertbox", role: "status", text:
        mgr ? "มีคำขอแก้ไข " + pend.length + " รายการรอคุณพิจารณา (ดูด้านล่าง)" : "คุณมีคำขอแก้ไขที่รอ SHE พิจารณาอยู่ ข้อมูลจะเปลี่ยนเมื่อ SHE อนุมัติ" }));

      // ข้อมูลปัจจุบัน แบ่งกลุ่มให้อ่านง่าย
      box.append(groupOf("เกิดอะไรขึ้น", ["occurred_on", "occurred_time", "location", "description", "incident_type_id", "department_text", "how_text", "why_text", "immediate_action"]));
      const pg = h("div", { class: "group" }, h("h4", { text: "ผู้เกี่ยวข้อง" }));
      if (!state.persons.length) pg.append(h("p", { text: "ไม่มีข้อมูลผู้เกี่ยวข้อง" }));
      state.persons.forEach((p, i) => pg.append(h("p", {}, h("strong", { text: "คนที่ " + (i + 1) + ": " }),
        fmtVal("role_in_case", p.role_in_case) + " | ชนิดการบาดเจ็บ: " + fmtVal("injury_type_code", p.injury_type_code) +
        " | ตำแหน่ง: " + fmtVal("body_part_codes", p.body_part_codes))));
      box.append(pg);
      const cls = ["high_hazard_code", "system_failure_code", "root_cause_code", "is_recordable", "is_serious_potential"];
      const cg = groupOf("การจัดประเภทโดย SHE", cls);
      if (cls.every((k) => inc[k] === null || inc[k] === undefined)) cg.append(h("small", { text: "SHE ยังไม่ได้จัดประเภท (ปกติจะทำในขั้น \"SHE ตรวจสอบ\")" }));
      box.append(cg);

      // คำขอแก้ไข
      if (state.reqs.length) {
        box.append(h("h4", { text: "คำขอแก้ไข" }));
        state.reqs.forEach((q) => box.append(reqBox(q, mgr)));
      }

      // แก้ไข / ขอแก้ไข
      if (deleted) { /* ไม่มีการแก้ไข */ }
      else if (closed) { if (isAdminRole()) box.append(reopenForm()); }
      else if (mgr || reporter) {
        const det = h("details", { class: "editdet" },
          h("summary", { text: mgr ? "แก้ไขข้อมูลรายงาน (ต้องระบุเหตุผล)" : "ข้อมูลไม่ถูกต้อง? ขอแก้ไขได้ที่นี่" }),
          h("div", {}, editForm(mgr)));
        if (pend.length && !mgr) det.open = false;
        box.append(det);
        if (mgr) box.append(closeForm());
      }

      // ประวัติ
      const ACT = { edit: "แก้ไขโดย SHE/Admin", approve_edit: "แก้ไขตามคำขอ (อนุมัติแล้ว)", close: "ปิดเคส (Close)", reopen: "เปิดเคสใหม่ (Reopen)" };
      const hist = h("div");
      if (!state.log.length) hist.append(h("p", { text: "ยังไม่มีประวัติการแก้ไข" }));
      state.log.forEach((l) => {
        const lines = describeChanges(l.changes || {});
        hist.append(h("div", { class: "logbox" }, h("strong", { text: ACT[l.action] || l.action }),
          h("small", { text: "  " + fmtTime(l.created_at) }), h("div", { text: "เหตุผล: " + l.reason }),
          lines.map((t) => h("div", { text: "• " + t }))));
      });
      box.append(h("details", { class: "histdet" }, h("summary", { text: "ประวัติการแก้ไข (" + state.log.length + ")" }), hist));
      box.append(h("div", { class: "rowbtns" }, h("button", { type: "button", class: "secondary small", text: "ปิดหน้านี้", onclick: () => { box.hidden = true; } })));
    }

    function reqBox(q, mgr) {
      const old = (scope, pid, k) => scope === "report" ? state.inc[k] : (state.persons.find((p) => p.id === pid) || {})[k];
      const ST = { pending: "รอดำเนินการ", approved: "อนุมัติแล้ว", rejected: "ไม่อนุมัติ", cancelled: "ยกเลิกแล้ว" };
      const mine = me && q.requested_by === me.id;
      const div = h("div", { class: "reqbox " + q.status },
        h("strong", { text: ST[q.status] || q.status }), h("small", { text: "  " + fmtTime(q.created_at) + (mine ? " · คำขอของคุณ" : "") }),
        h("div", { text: "เหตุผลที่ขอ: " + q.reason }),
        describeChanges(q.changes || {}, old).map((t) => h("div", { text: "• " + t })));
      if (q.decision_note) div.append(h("div", { text: "หมายเหตุผู้พิจารณา: " + q.decision_note }));
      if (q.status === "pending") {
        const row = h("div", { class: "rowbtns" });
        if (mine) row.append(h("button", { type: "button", class: "small btn-danger-outline", text: "ยกเลิกคำขอ",
          onclick: () => act(sb.rpc("cancel_incident_edit", { req: q.id }), "ยกเลิกคำขอแล้ว") }));
        if (mgr && !mine) {
          const note = h("input", { type: "text", placeholder: "หมายเหตุ (จำเป็นเมื่อปฏิเสธ)", "aria-label": "หมายเหตุการพิจารณา", maxlength: "500" });
          row.append(
            h("button", { type: "button", class: "small btn-ok", text: "อนุมัติ (จะแก้ข้อมูลทันที)",
              onclick: () => act(sb.rpc("decide_incident_edit", { req: q.id, approve: true, note: note.value.trim() || null }), "อนุมัติและแก้ไขข้อมูลแล้ว") }),
            note,
            h("button", { type: "button", class: "small btn-danger-outline", text: "ไม่อนุมัติ",
              onclick: () => {
                if (note.value.trim().length < 3) { showMsg("การไม่อนุมัติต้องระบุหมายเหตุ (อย่างน้อย 3 ตัวอักษร)", false); note.focus(); return; }
                act(sb.rpc("decide_incident_edit", { req: q.id, approve: false, note: note.value.trim() }), "บันทึกการไม่อนุมัติแล้ว");
              } }));
        }
        div.append(row);
      }
      return div;
    }

    function editForm(mgr) {
      const inc = state.inc;
      const wrap = h("div", { class: "editgrid" });
      wrap.append(h("p", {}, h("strong", { text: "วิธีใช้ (3 ขั้นตอน)" })),
        h("ol", { class: "steps123" },
          h("li", { text: "แก้เฉพาะช่องที่ต้องการเปลี่ยน (ช่องที่แก้จะมีกรอบสีน้ำเงิน)" }),
          h("li", { text: "ตรวจ \"สรุปสิ่งที่จะเปลี่ยน\" และพิมพ์เหตุผล" }),
          h("li", { text: mgr ? "กด \"บันทึกการแก้ไข\" ข้อมูลเปลี่ยนทันทีและมีประวัติเก็บไว้" : "กด \"ส่งคำขอแก้ไข\" ข้อมูลจะเปลี่ยนเมื่อ SHE อนุมัติ" })));
      const rf = REPORT_FIELDS.filter((f) => mgr || !f.mgr).map((f) => ({ f, i: makeInput(f, inc[f.k], "e-") }));
      rf.forEach(({ i }) => wrap.append(i.label, i.control, i.hint));
      const pf = state.persons.map((p, n) => {
        const box = h("div", { class: "personedit" }, h("strong", { text: "ผู้เกี่ยวข้องคนที่ " + (n + 1) }));
        const items = PERSON_FIELDS.map((f) => ({ f, i: makeInput(f, p[f.k], "p" + n + "-") }));
        items.forEach(({ i }) => box.append(i.label, i.control, i.hint));
        wrap.append(box); return { p, items };
      });

      const preview = h("div", { class: "previewbox", "aria-live": "polite" });
      const reason = h("textarea", { id: "e-reason", required: true, maxlength: "1000", "aria-describedby": "e-reason-help",
        placeholder: "เช่น ระบุตำแหน่งที่บาดเจ็บผิด ตรวจสอบกับใบรายงานแพทย์แล้ว" });

      // รวบรวมสิ่งที่เปลี่ยน (ใช้ทั้งแสดงตัวอย่างและตอนส่ง)
      function collect() {
        const changes = { report: {}, persons: {} }; let missing = null;
        rf.forEach(({ f, i }) => {
          const v = i.get(); const ch = !same(f.k, inc[f.k], v);
          i.control.classList.toggle("changed", ch);
          if (f.req && v === null) { missing = missing || { f, i }; }
          if (ch) changes.report[f.k] = v;
        });
        pf.forEach(({ p, items }) => {
          const d = {};
          items.forEach(({ f, i }) => { const v = i.get(); const ch = !same(f.k, p[f.k], v); i.control.classList.toggle("changed", ch); if (ch) d[f.k] = v; });
          if (Object.keys(d).length) changes.persons[p.id] = d;
        });
        return { changes, missing, count: Object.keys(changes.report).length + Object.keys(changes.persons).length };
      }
      function refresh() {
        const { changes, count } = collect();
        preview.replaceChildren(h("div", { class: "t", text: "สรุปสิ่งที่จะเปลี่ยน" }));
        if (!count) { preview.append(h("div", { text: "ยังไม่มีการเปลี่ยนแปลง (ลองแก้ช่องด้านบน)" })); return; }
        const old = (scope, pid, k) => scope === "report" ? inc[k] : (state.persons.find((p) => p.id === pid) || {})[k];
        describeChanges(changes, old).forEach((t) => preview.append(h("div", { text: "• " + t })));
      }
      wrap.addEventListener("input", refresh); wrap.addEventListener("change", refresh);

      wrap.append(preview, h("label", { for: "e-reason", text: "เหตุผลที่แก้ไข * (อย่างน้อย 10 ตัวอักษร)" }), reason,
        h("small", { class: "hint", id: "e-reason-help", text: "บอกสั้น ๆ ว่าทำไมต้องแก้ เพื่อให้ผู้ตรวจสอบเข้าใจ" }));

      const btn = h("button", { type: "button", class: "btn-ok", text: mgr ? "บันทึกการแก้ไข" : "ส่งคำขอแก้ไข" });
      btn.addEventListener("click", () => {
        const { changes, missing, count } = collect();
        if (missing) { showMsg("ช่อง \"" + LBL[missing.f.k] + "\" ห้ามเว้นว่าง", false); missing.i.control.focus(); return; }
        if (!count) { showMsg("ยังไม่มีการเปลี่ยนแปลงจากค่าเดิม", false); return; }
        const rs = reason.value.trim();
        if (rs.length < 10) { showMsg("กรุณาระบุเหตุผลอย่างน้อย 10 ตัวอักษร", false); reason.focus(); return; }
        if (mgr) act(sb.rpc("edit_incident", { inc: inc.id, changes, reason: rs }), "บันทึกการแก้ไขเรียบร้อย");
        else act(sb.rpc("request_incident_edit", { inc: inc.id, changes, reason: rs }), "ส่งคำขอแก้ไขเรียบร้อย รอ SHE/Admin พิจารณา");
      });
      wrap.append(h("div", { class: "rowbtns" }, btn));
      refresh();
      return wrap;
    }

    function closeForm() {
      const r = h("input", { type: "text", placeholder: "หมายเหตุการปิด (ไม่บังคับ)", maxlength: "500", "aria-label": "หมายเหตุการปิด" });
      return h("div", {}, h("h4", { text: "ปิดเคส (Close)" }),
        h("p", { text: "กดเมื่อตรวจสอบและจัดประเภทครบแล้ว เมื่อปิดเคสแล้วจะแก้ไขไม่ได้ ต้องให้ Admin เปิดใหม่ (Reopen) พร้อมเหตุผล" }),
        h("div", { class: "rowbtns" }, r, h("button", { type: "button", class: "btn-danger-outline", text: "ปิดเคส (Close)",
          onclick: () => act(sb.rpc("close_incident", { inc: state.inc.id, reason: r.value.trim() || null }), "ปิดรายงานแล้ว") })));
    }

    function reopenForm() {
      const r = h("input", { type: "text", placeholder: "เหตุผลที่เปิดใหม่ (อย่างน้อย 10 ตัวอักษร)", maxlength: "500", "aria-label": "เหตุผลที่เปิดใหม่" });
      return h("div", { class: "rowbtns" }, r, h("button", { type: "button", class: "btn-ok", text: "เปิดรายงานใหม่ (Reopen)",
        onclick: () => act(sb.rpc("reopen_incident", { inc: state.inc.id, reason: r.value.trim() }), "เปิดรายงานใหม่แล้ว") }));
    }

    // เรียก RPC -> แจ้งผล -> โหลดตารางและแผงใหม่ (สิทธิ์จริงตัดสินที่ฐานข้อมูล ไม่ใช่หน้านี้)
    async function act(promise, okText) {
      document.querySelectorAll("#detail button").forEach((b) => { b.disabled = true; });
      const { error } = await promise;
      if (error) { showMsg(errTh(error), false); document.querySelectorAll("#detail button").forEach((b) => { b.disabled = false; }); return; }
      showMsg(okText, true);
      await loadIncidents();
      await openDetail(state.inc.id);
    }

    (async () => {
      me = await getMyProfile();
      await loadMasters();
      await loadIncidents();
    })();

    load("checklist_inspections", "inspected_on",
      "inspected_on, area, items, note, created_at",
      "t-checklist", ["วันที่", "พื้นที่", "ผ่าน", "หมายเหตุ", "บันทึกเมื่อ"],
      (r) => {
        const v = Object.values(r.items || {});
        return [r.inspected_on, r.area, v.filter(Boolean).length + "/" + v.length, r.note, fmtTime(r.created_at)];
      });

    load("training_records", "trained_on",
      "trained_on, course, hours, attendees, created_at",
      "t-training", ["วันที่", "หลักสูตร", "ชั่วโมง", "ผู้เข้าอบรม", "บันทึกเมื่อ"],
      (r) => [r.trained_on, r.course, r.hours, r.attendees, fmtTime(r.created_at)]);
  </script>
</body>
</html>
