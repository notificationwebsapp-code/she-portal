<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="style.css">
  <title>บันทึกการอบรม | SHE Portal</title>
  <style>
    .plantline{margin:0 0 1.1rem;padding:.5rem .8rem;background:#eef2f9;border-radius:8px}
    form .formactions{margin:1.2rem 0 .5rem;display:flex;flex-wrap:wrap;gap:.6rem;align-items:center}
  </style>
</head>
<body>
  <header>
    <h1>SHE Portal</h1>
    <nav>
      <a href="index.html">หน้าแรก</a>
      <a href="incident.html">รายงานอุบัติเหตุ</a>
      <a href="checklist.html">เช็กลิสต์ตรวจ</a>
      <a href="training.html">บันทึกการอบรม</a>
      <a href="records.html">ดูข้อมูล</a>
      <a href="login.html">เข้าสู่ระบบ</a>
    </nav>
  </header>

  <main>
    <h2>บันทึกการอบรม</h2>
    <p id="msg" role="status" class="msg" hidden></p>
    <form id="main-form">
      <p id="plant-single" class="plantline" hidden></p>
      <p id="plant-row" hidden>
        <label for="plant">Plant ที่จัดอบรม</label><br>
        <select id="plant"><option value="">-- เลือก --</option></select>
      </p>
      <p>
        <label for="course">ชื่อหลักสูตร</label><br>
        <input type="text" id="course" name="course" required>
      </p>
      <p>
        <label for="date">วันที่อบรม</label><br>
        <input type="date" id="date" name="date" required>
      </p>
      <p>
        <label for="hours">จำนวนชั่วโมง</label><br>
        <input type="number" id="hours" name="hours" min="0.5" step="0.5" required>
      </p>
      <p>
        <label for="attendees">จำนวนผู้เข้าอบรม</label><br>
        <input type="number" id="attendees" name="attendees" min="1" required>
      </p>
      <div class="formactions">
        <button type="submit" id="btn-save">บันทึกการอบรม</button>
      </div>
    </form>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script src="config.js"></script>
  <script src="auth.js"></script>
  <script src="draft.js"></script>
  <script src="plant.js"></script>
  <script>requireLogin();</script>
  <script>
    const form = document.getElementById("main-form");
    const msg = document.getElementById("msg");
    const btn = document.getElementById("btn-save");
    function show(text, isError) {
      msg.textContent = text;
      msg.className = "msg " + (isError ? "error" : "ok");
      msg.hidden = false;
    }

    // ---- Save draft (หลักการข้อ 11: ทุกฟอร์มต้องมีบันทึกร่าง) ----
    function getState() {
      return {
        plant: ShePlant.current(), course: form.course.value, date: form.date.value,
        hours: form.hours.value, attendees: form.attendees.value
      };
    }
    async function setState(s) {
      ShePlant.set(s.plant);
      form.course.value = s.course || "";
      form.date.value = s.date || "";
      form.hours.value = s.hours || "";
      form.attendees.value = s.attendees || "";
    }
    function draftTitle() {
      const c = form.course.value.trim();
      return "บันทึกการอบรม" + (c ? " · " + c : "") + (form.date.value ? " · " + form.date.value : "");
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const pid = ShePlant.current();
      if (!pid) return show("ไม่พบ Plant ที่ได้รับสิทธิ์ กรุณาเลือก Plant หรือติดต่อ Admin", true);
      btn.disabled = true;
      const { error } = await sb.from("training_records").insert({
        plant_id: pid,
        course: form.course.value.trim(),
        trained_on: form.date.value,
        hours: Number(form.hours.value),        // ฟอร์มส่งเป็นข้อความ ต้องแปลงเป็นตัวเลข
        attendees: parseInt(form.attendees.value, 10)
      });
      btn.disabled = false;
      if (error) {
        if (error.code === "42501") return show("ไม่มีสิทธิ์บันทึก (ต้องเป็น SHE/Admin ของ Plant ที่เลือก)", true);
        return show("บันทึกไม่สำเร็จ: " + error.message, true);
      }
      const keep = ShePlant.current();
      form.reset();
      ShePlant.set(keep);
      await SheDraft.clear();
      show("บันทึกการอบรมเรียบร้อยแล้ว", false);
    });

    ShePlant.init({ select: document.getElementById("plant"),
                    single: document.getElementById("plant-single"),
                    row: document.getElementById("plant-row") });
    SheDraft.init({ formType: "training", form: form, getState: getState, setState: setState,
                    getTitle: draftTitle, getPlantId: ShePlant.current,
                    actionsEl: document.querySelector(".formactions") });
  </script>
</body>
</html>
